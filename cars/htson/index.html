  <meta name="description" content="HTSON Group - Tập đoàn đa ngành: Bất động sản, Tài chính & Đầu tư, Du lịch & Khách sạn, Giáo dục. Kiến tạo giá trị - Midas Touch.">
  <link rel="icon" href="./assets/logo.jpg">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { margin: 0; overflow-x: hidden; font-family: 'Be Vietnam Pro', Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    .fade-in { animation: fadeSlide 0.6s ease both; }
    @keyframes kenburns { 0% { transform: scale(1.08) } 100% { transform: scale(1) } }
    .kenburns { animation: kenburns 12s ease-out forwards; }
    /* Hiện dần khi cuộn tới */
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s cubic-bezier(.22,.61,.36,1); }
    .reveal.is-visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .kenburns { animation: none; }
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #FBF3E4; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(#F1D998, #C9A24B); border-radius: 10px; border: 2px solid #FBF3E4; }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(#C9A24B, #B8892C); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const NAV = ["TRANG CHỦ", "GIỚI THIỆU", "LĨNH VỰC HOẠT ĐỘNG", "TIN TỨC", "LIÊN HỆ"];

    const divisions = [
      {
        id: "bds",
        icon: "🏙️",
        name: "Bất động sản",
        tagline: "Kiến tạo không gian - Vun đắp giá trị",
        desc: "Phát triển và vận hành các dự án nhà ở, thương mại và đô thị. Mỗi công trình là một dấu ấn bền vững cho cộng đồng nơi nó hiện diện.",
        color: "from-[#F4E7C9] to-[#E3C482]",
        image: "./assets/bat-dong-san.png"
      },
      {
        id: "taichinh",
        icon: "💰",
        name: "Tài chính & Đầu tư",
        tagline: "Chạm tay hóa vàng - Sinh lời bền vững",
        desc: "Tư vấn đầu tư và quản lý tài sản với danh mục đa dạng. Chúng tôi theo đuổi lợi nhuận đi cùng kỷ luật kiểm soát rủi ro.",
        color: "from-[#F8ECC9] to-[#D9A441]",
        image: "./assets/tai-chinh-dau-tu.jpg"
      },
      {
        id: "dulich",
        icon: "🏖️",
        name: "Du lịch & Khách sạn",
        tagline: "Nâng niu trải nghiệm - Trọn vẹn cảm xúc",
        desc: "Đầu tư và vận hành tổ hợp nghỉ dưỡng, khách sạn theo chuẩn mực quốc tế. Nơi mỗi vị khách được đón tiếp như một người thân.",
        color: "from-[#EFE0C0] to-[#C7A24E]",
        image: "./assets/dulich-khach-san.jpg"
      },
      {
        id: "giaoduc",
        icon: "🎓",
        name: "Giáo dục",
        tagline: "Ươm mầm tri thức - Chắp cánh tương lai",
        desc: "Đầu tư hệ thống giáo dục chất lượng cao với chương trình đào tạo hiện đại, đồng hành cùng thế hệ trẻ trên hành trình trưởng thành.",

        lightArtwork: true
      }
    ];

    // Icon line-art vàng cho từng loại tin (SVG path, stroke mảnh cho cảm giác sang trọng)
    const NEWS_ICONS = {
      "SỰ KIỆN": "M12 3l2.4 5.2 5.6.7-4.1 3.9 1.1 5.6L12 15.7 6.9 18.4l1.1-5.6L4 8.9l5.6-.7L12 3z",
      "DỰ ÁN": "M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6M9.5 12h1.5M13 12h1.5",
      "HỢP TÁC": "M8 11a3 3 0 100-6 3 3 0 000 6zM16 11a3 3 0 100-6 3 3 0 000 6zM3 20v-1a4 4 0 014-4h2a4 4 0 014 4v1M13 20v-1a4 4 0 014-4h0a4 4 0 014 4v1"
    };

    const news = [
      { tag: "SỰ KIỆN", title: "HTSON Group công bố định hướng phát triển đa ngành giai đoạn mới", date: "2026", excerpt: "Tập đoàn tiếp tục mở rộng đầu tư vào 4 trụ cột chiến lược: Bất động sản, Tài chính, Du lịch và Giáo dục." },
      { tag: "DỰ ÁN", title: "Khởi động dự án bất động sản trọng điểm tại Hà Tĩnh", date: "2026", excerpt: "Dự án được kỳ vọng góp phần thay đổi diện mạo đô thị và tạo giá trị bền vững cho khu vực." },
      { tag: "HỢP TÁC", title: "HTSON mở rộng hợp tác chiến lược trong lĩnh vực tài chính - đầu tư", date: "2026", excerpt: "Các thỏa thuận hợp tác nhằm tăng cường năng lực quản lý tài sản và tối ưu hiệu quả đầu tư." }
    ];

    const stats = [
      { value: "4", label: "Lĩnh vực hoạt động" },
      { value: "100%", label: "Cam kết uy tín" },
      { value: "HT", label: "Hà Tĩnh nơi khởi nguồn" },
      { value: "★★★★★", label: "Chất lượng dịch vụ" }
    ];

    const CONTACT = {
      companyFull: "CÔNG TY CỔ PHẦN TẬP ĐOÀN HTSON",
      address: "102 Phú Hào, Phường Thành Sen, Tỉnh Hà Tĩnh",
      phone1: "0985.291.568",
      phone2: "0943.336.511",
      mapUrl: "https://www.google.com/maps/search/?api=1&query=102+Ph%C3%BA+H%C3%A0o%2C+Ph%C6%B0%E1%BB%9Dng+Th%C3%A0nh+Sen%2C+H%C3%A0+T%C4%A9nh"
    };

    // Icon SVG line-art thay cho emoji — hiển thị đồng nhất trên mọi hệ điều hành
    function IconPhone({ className = "w-4 h-4", stroke = "currentColor" }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke={stroke} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
          <path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 1.9.6 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.1a2 2 0 012.1-.5c.9.3 1.8.5 2.8.6a2 2 0 011.7 2z" />
        </svg>
      );
    }

    function IconPin({ className = "w-4 h-4", stroke = "currentColor" }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke={stroke} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
      );
    }

    function IconCompass({ className = "w-4 h-4", stroke = "currentColor" }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke={stroke} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M16.2 7.8l-2.9 6.4-6.4 2.9 2.9-6.4 6.4-2.9z" />
        </svg>
      );
    }

    function IconCheck({ className = "w-4 h-4", stroke = "currentColor" }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke={stroke} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      );
    }

    function Header({ menuOpen, setMenuOpen, activeSection, onNav }) {
      return (
        <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-xl border-b border-black/5 shadow-[0_4px_24px_rgba(139,26,26,0.06)]">
          <div className="bg-[#7A1315] text-white text-[11px] sm:text-[12px]">
            <div className="mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8 h-8 flex items-center justify-between">
              <span className="hidden sm:inline opacity-90 tracking-wide">CÔNG TY CỔ PHẦN TẬP ĐOÀN HTSON — MIDAS TOUCH</span>
              <div className="flex items-center gap-3 sm:gap-4">
                <a href={`tel:${CONTACT.phone1.replace(/\./g, "")}`} className="flex items-center gap-1.5 font-semibold hover:text-[#F1D998] transition"><IconPhone className="w-3.5 h-3.5" /> {CONTACT.phone1}</a>
                <span className="hidden md:inline opacity-50">|</span>
                <a href={`tel:${CONTACT.phone2.replace(/\./g, "")}`} className="hidden md:flex items-center gap-1.5 font-semibold hover:text-[#F1D998] transition"><IconPhone className="w-3.5 h-3.5" /> {CONTACT.phone2}</a>
              </div>
            </div>
          </div>
          <div className="mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8 h-[76px] flex items-center justify-between">
            <div className="flex items-center gap-3">
              <img src="./assets/logo.jpg" alt="HTSON Group" className="w-12 h-12 rounded-full object-cover border border-[#C9A24B]/40 shadow" />
              <div className="leading-none">
                <div className="font-extrabold text-[18px] sm:text-[20px] tracking-wide text-[#7A1315]">HTSON <span className="text-[#B8892C] font-light">GROUP</span></div>
                <div className="text-[10px] font-semibold tracking-[0.2em] text-black/50 mt-1">MIDAS TOUCH</div>
              </div>
            </div>
            <nav className="hidden lg:flex items-center gap-7 text-[13px] font-semibold text-[#3A2A1A]">
              {NAV.map(label => (
                <button key={label} onClick={() => onNav(label)}
                  className={`relative pb-1 hover:text-[#7A1315] transition ${activeSection === label ? "text-[#7A1315]" : ""}`}>
                  {label}
                  <span className={`absolute left-0 -bottom-0.5 h-[2px] rounded-full bg-gradient-to-r from-[#C9A24B] to-[#F1D998] transition-all duration-300 ${activeSection === label ? "w-full opacity-100" : "w-0 opacity-0"}`}></span>
                </button>
              ))}
            </nav>
            <div className="flex items-center gap-2">
              <a href={`tel:${CONTACT.phone1.replace(/\./g, "")}`} className="hidden md:inline-flex h-10 px-5 rounded-full bg-gradient-to-r from-[#7A1315] to-[#5C0E0F] border border-[#C9A24B]/50 text-white text-[13px] font-semibold items-center gap-2 hover:border-[#C9A24B] hover:shadow-[0_6px_18px_rgba(201,162,75,0.3)] transition shadow"><IconPhone className="w-4 h-4" /> Liên hệ ngay</a>
              <button onClick={() => setMenuOpen(o => !o)} className="lg:hidden w-9 h-9 grid place-items-center rounded-full border border-black/10">
                <div className="space-y-1">
                  <div className={`w-4 h-0.5 bg-[#7A1315] transition ${menuOpen ? "rotate-45 translate-y-1" : ""}`}></div>
                  <div className={`w-4 h-0.5 bg-[#7A1315] transition ${menuOpen ? "opacity-0" : ""}`}></div>
                  <div className={`w-4 h-0.5 bg-[#7A1315] transition ${menuOpen ? "-rotate-45 -translate-y-1" : ""}`}></div>
                </div>
              </button>
            </div>
          </div>
          {menuOpen && (
            <div className="lg:hidden border-t border-black/5 bg-white">
              <div className="px-4 py-3 grid gap-1">
                {NAV.map(label => (
                  <button key={label} onClick={() => onNav(label)} className="text-left py-3 px-3 rounded-xl text-[14px] font-semibold hover:bg-[#FBF3E4] text-[#3A2A1A]">{label}</button>
                ))}
                <a href={`tel:${CONTACT.phone1.replace(/\./g, "")}`} className="mt-2 h-12 rounded-xl bg-gradient-to-r from-[#7A1315] to-[#5C0E0F] border border-[#C9A24B]/40 text-white flex items-center justify-center gap-2 font-bold"><IconPhone className="w-4 h-4" /> Gọi {CONTACT.phone1}</a>
              </div>
            </div>
          )}
        </header>
      );
    }

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [slide, setSlide] = useState(0);
      const [activeSection, setActiveSection] = useState("TRANG CHỦ");
      const heroRef = useRef(null);
      const aboutRef = useRef(null);
      const divisionsRef = useRef(null);
      const newsRef = useRef(null);
      const contactRef = useRef(null);

      const slides = [
        { title: "TẬP ĐOÀN HTSON", sub: "Kiến tạo giá trị - Vươn tầm bền vững" },
        { title: "MIDAS TOUCH", sub: "Chạm tay hóa vàng trong từng lĩnh vực đầu tư" },
        { title: "ĐA NGÀNH - ĐA GIÁ TRỊ", sub: "Bất động sản · Tài chính · Du lịch · Giáo dục" }
      ];

      useEffect(() => {
        const t = setInterval(() => setSlide(s => (s + 1) % slides.length), 4500);
        return () => clearInterval(t);
      }, []);

      const refMap = {
        "TRANG CHỦ": heroRef,
        "GIỚI THIỆU": aboutRef,
        "LĨNH VỰC HOẠT ĐỘNG": divisionsRef,
        "TIN TỨC": newsRef,
        "LIÊN HỆ": contactRef
      };

      const onNav = (label) => {
        setMenuOpen(false);
        if (label === "TRANG CHỦ") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
        refMap[label]?.current?.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      // Theo dõi mục đang xem để highlight trên thanh menu
      useEffect(() => {
        const entries = Object.entries(refMap)
          .map(([label, ref]) => [label, ref.current])
          .filter(([, el]) => el);
        if (!entries.length) return;
        const byEl = new Map(entries.map(([label, el]) => [el, label]));
        const io = new IntersectionObserver(
          obs => {
            const hit = obs
              .filter(o => o.isIntersecting)
              .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
            if (hit) setActiveSection(byEl.get(hit.target));
          },
          { rootMargin: "-45% 0px -45% 0px", threshold: [0, 0.25, 0.5, 1] }
        );
        entries.forEach(([, el]) => io.observe(el));
        return () => io.disconnect();
      }, []);

      // Hiện dần các khối khi cuộn tới
      useEffect(() => {
        const targets = document.querySelectorAll(".reveal");
        if (!targets.length) return;
        const io = new IntersectionObserver(
          obs => obs.forEach(o => {
            if (o.isIntersecting) { o.target.classList.add("is-visible"); io.unobserve(o.target); }
          }),
          { rootMargin: "0px 0px -12% 0px", threshold: 0.12 }
        );
        targets.forEach(t => io.observe(t));
        return () => io.disconnect();
      }, []);

      return (
        <div className="min-h-screen bg-[#FFFDF9] text-[#3A2A1A] antialiased selection:bg-[#7A1315] selection:text-white">
          {/* Gradient vàng dùng chung cho stroke của các icon SVG */}
          <svg width="0" height="0" className="absolute" aria-hidden="true">
            <defs>
              <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor="#FDF3D8" />
                <stop offset="50%" stopColor="#F1D998" />
                <stop offset="100%" stopColor="#C9A24B" />
              </linearGradient>
            </defs>
          </svg>
          <Header menuOpen={menuOpen} setMenuOpen={setMenuOpen} onNav={onNav} activeSection={activeSection} />

          <section ref={heroRef} className="relative overflow-hidden h-[420px] sm:h-[520px] flex items-center">
            <img src="./assets/hero-bg.png" alt="" aria-hidden="true" className="absolute inset-0 w-full h-full object-cover object-center kenburns" />
            <div className="absolute inset-0" style={{backgroundImage: "linear-gradient(100deg, rgba(92,14,15,0.94) 0%, rgba(122,19,21,0.82) 32%, rgba(122,19,21,0.42) 58%, rgba(122,19,21,0.10) 78%, rgba(122,19,21,0) 100%)"}}></div>
            <div className="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-[#3A0A0B]/70 to-transparent"></div>
            <div className="relative mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8 w-full">
              <div key={slide} className="fade-in max-w-[720px]">
                <div className="inline-flex items-center gap-2 bg-black/25 backdrop-blur-sm border border-[#C9A24B]/50 px-4 py-1.5 rounded-full text-[11px] font-bold text-[#F1D998] tracking-wide">
                  <span className="w-2 h-2 bg-[#F1D998] rounded-full animate-pulse"></span> CÔNG TY CỔ PHẦN TẬP ĐOÀN HTSON
                </div>
                <h1 className="text-white font-extrabold tracking-tight mt-5 text-[32px] sm:text-[48px] leading-[1.1]">{slides[slide].title}</h1>
                <p className="text-[#F1D998] text-[15px] sm:text-[18px] font-medium mt-3">{slides[slide].sub}</p>
                <div className="flex flex-wrap gap-3 mt-7">
                  <button onClick={() => onNav("LĨNH VỰC HOẠT ĐỘNG")} className="h-[50px] px-6 rounded-full bg-gradient-to-r from-[#C9A24B] via-[#F1D998] to-[#C9A24B] text-[#5C0E0F] text-[14px] font-extrabold hover:brightness-110 transition shadow-[0_8px_24px_rgba(201,162,75,0.4)]">
                    KHÁM PHÁ LĨNH VỰC
                  </button>
                  <a href={`tel:${CONTACT.phone1.replace(/\./g, "")}`} className="h-[50px] px-6 rounded-full border border-[#C9A24B]/60 text-white text-[14px] font-bold flex items-center gap-2 hover:bg-[#C9A24B]/15 hover:border-[#C9A24B] transition">
                    <IconPhone className="w-4 h-4" /> {CONTACT.phone1}
                  </a>
                </div>
              </div>
            </div>
            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-2">
              {slides.map((_, i) => (
                <button key={i} onClick={() => setSlide(i)} aria-label={`Chuyển tới slide ${i + 1}`}
                  className={`h-1.5 rounded-full transition-all ${slide === i ? "w-8 bg-gradient-to-r from-[#C9A24B] to-[#F1D998] shadow-[0_0_12px_rgba(241,217,152,0.8)]" : "w-1.5 bg-white/40 hover:bg-white/70"}`}></button>
              ))}
            </div>
          </section>

          <section className="relative z-10 -mt-8">
            <div className="mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8">
              <div className="bg-white rounded-[18px] shadow-[0_16px_48px_rgba(122,19,21,0.14)] border border-[#C9A24B]/25 grid grid-cols-2 lg:grid-cols-4 divide-x divide-y lg:divide-y-0 divide-[#C9A24B]/20 overflow-hidden">
                {stats.map(s => (
                  <div key={s.label} className="flex flex-col items-center justify-center gap-1 px-2 sm:px-4 py-4 sm:py-5 text-center min-w-0 hover:bg-[#FBF3E4]/60 transition-colors">
                    <div className="font-extrabold text-[17px] sm:text-[22px] truncate max-w-full bg-clip-text text-transparent bg-gradient-to-br from-[#7A1315] to-[#B8892C]">{s.value}</div>
                    <div className="text-[10px] sm:text-[11px] text-black/60 font-medium truncate max-w-full">{s.label}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <section ref={aboutRef} className="reveal mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8 py-14 sm:py-20">
            <div className="grid lg:grid-cols-2 gap-10 items-center">
              <div>
                <div className="inline-flex items-center gap-2 text-[#B8892C] text-[12px] font-bold tracking-[0.2em]">GIỚI THIỆU TẬP ĐOÀN</div>
                <h2 className="text-[26px] sm:text-[34px] font-extrabold text-[#7A1315] mt-2 leading-tight">HTSON GROUP - <span className="text-[#B8892C]">Midas Touch</span></h2>
                <div className="w-16 h-1 bg-[#C9A24B] rounded-full mt-4 mb-5"></div>
                <p className="text-[14px] sm:text-[15px] leading-[1.8] text-black/70">
                  Trong thần thoại, vua Midas chạm tay đến đâu, nơi đó hóa vàng. Với <b className="text-[#7A1315]">HTSON</b>, <b className="text-[#7A1315]">"Midas Touch"</b> không chỉ là phép màu — mà còn là cam kết: mỗi dự án chúng tôi đặt tay vào đều phải tạo nên giá trị đẳng cấp cho khách hàng.
                </p>
                <p className="text-[14px] sm:text-[15px] leading-[1.8] text-black/70 mt-4">

                </p>
                <div className="mt-7 grid grid-cols-2 gap-3">
                  {["Uy tín - Minh bạch", "Đổi mới - Bền vững", "Đa ngành - Chuyên sâu", "Con người là trung tâm"].map(v => (
                    <div key={v} className="flex items-center gap-2.5 text-[13px] font-extrabold text-[#7A1315] bg-[#FBF3E4]/70 border border-[#C9A24B]/25 rounded-xl px-3 py-2.5 hover:border-[#C9A24B]/60 hover:bg-[#FBF3E4] transition">
                      <span className="w-6 h-6 rounded-full bg-white border border-[#C9A24B]/40 grid place-items-center shrink-0">
                        <IconCheck className="w-3.5 h-3.5" stroke="url(#goldStroke)" />
                      </span> {v}
                    </div>
                  ))}
                </div>
              </div>
              <div className="relative">
                <div className="group aspect-[4/3] rounded-[24px] bg-gradient-to-br from-[#7A1315] via-[#8C1A1C] to-[#5C0E0F] shadow-[0_24px_64px_rgba(122,19,21,0.35)] flex items-center justify-center overflow-hidden relative">
                  {/* Hoa văn art-deco vàng mờ */}
                  <div className="absolute inset-0 opacity-[0.13]" style={{backgroundImage: "repeating-linear-gradient(45deg, #C9A24B 0 1px, transparent 1px 16px), repeating-linear-gradient(-45deg, #C9A24B 0 1px, transparent 1px 16px)"}}></div>
                  {/* Quầng sáng vàng sau logo */}
                  <div className="absolute inset-0" style={{backgroundImage: "radial-gradient(circle at 50% 48%, rgba(241,217,152,0.32) 0, transparent 58%)"}}></div>
                  {/* Khung viền vàng mảnh */}
                  <div className="absolute inset-4 rounded-[16px] border border-[#C9A24B]/30"></div>
                  {/* Góc trang trí kiểu khung tranh cổ điển */}

                  <div className="absolute top-4 right-4 w-8 h-8 border-t-2 border-r-2 border-[#C9A24B]/70 rounded-tr-[14px]"></div>
                  <div className="absolute bottom-4 left-4 w-8 h-8 border-b-2 border-l-2 border-[#C9A24B]/70 rounded-bl-[14px]"></div>

          <section ref={divisionsRef} className="reveal bg-[#FBF3E4] py-14 sm:py-20">
            <div className="mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8">

                <h2 className="text-[26px] sm:text-[34px] font-extrabold text-[#7A1315] mt-2">4 Trụ cột <span className="text-[#B8892C]">chiến lược</span></h2>
                <div className="w-16 h-1 bg-[#C9A24B] rounded-full mx-auto mt-4"></div>

                        {!d.lightArtwork && <div className="absolute inset-x-0 bottom-0 h-12 bg-gradient-to-t from-black/25 to-transparent"></div>}
                      </div>
                    ) : (
                      <div className={`h-[110px] bg-gradient-to-br ${d.color} flex items-center justify-center text-[40px]`}>{d.icon}</div>

                      <h3 className="font-extrabold text-[15px] text-[#7A1315]">{d.name}</h3>
                      <div className="w-8 h-[2px] rounded-full bg-gradient-to-r from-[#C9A24B] to-transparent mt-2 group-hover:w-14 transition-all duration-300"></div>
                      <p className="text-[12px] font-semibold text-[#B8892C] mt-2">{d.tagline}</p>
                      <p className="text-[12.5px] leading-[1.6] text-black/60 mt-2">{d.desc}</p>

              <h2 className="text-[26px] sm:text-[34px] font-extrabold text-[#7A1315] mt-2">Hoạt động <span className="text-[#B8892C]">nổi bật</span></h2>

                        <path d={NEWS_ICONS[n.tag]} />
                      </svg>
                      <span className="text-[10px] font-bold tracking-[0.2em] text-[#F1D998] border border-[#C9A24B]/40 bg-black/25 px-3 py-1 rounded-full">{n.tag}</span>
                    </div>
                  </div>
                  <div className="p-4">
                    <div className="text-[10px] text-black/40 font-semibold">{n.date}</div>
                    <h3 className="font-extrabold text-[14px] text-[#3A2A1A] mt-1 leading-snug">{n.title}</h3>
                    <p className="text-[12px] text-black/60 mt-2 leading-[1.6]">{n.excerpt}</p>
                  </div>
                </article>
              ))}
            </div>
          </section>

                <div className="text-[#F1D998] text-[12px] font-bold tracking-[0.2em]">LIÊN HỆ</div>

                      <div className="font-extrabold text-[16px] leading-tight bg-clip-text text-transparent bg-gradient-to-r from-[#FDF3D8] to-[#C9A24B]">{CONTACT.companyFull}</div>

                  </div>
                  <div className="h-px my-6 bg-gradient-to-r from-transparent via-[#C9A24B]/40 to-transparent"></div>

                    <a href={`tel:${CONTACT.phone2.replace(/\./g, "")}`} className="flex items-center gap-3 font-semibold hover:text-[#FDF3D8] transition"><span className="w-9 h-9 rounded-full bg-[#C9A24B]/15 border border-[#C9A24B]/30 grid place-items-center shrink-0"><IconPhone className="w-4 h-4" stroke="#F1D998" /></span> {CONTACT.phone2}</a>
                  </div>
                  <div className="mt-7 grid grid-cols-2 gap-3">
                    <a href={`tel:${CONTACT.phone1.replace(/\./g, "")}`} className="h-12 rounded-full bg-gradient-to-r from-[#C9A24B] via-[#F1D998] to-[#C9A24B] text-[#5C0E0F] flex items-center justify-center gap-2 font-extrabold text-[13px] shadow-[0_6px_20px_rgba(201,162,75,0.35)] hover:brightness-110 transition"><IconPhone className="w-4 h-4" /> Gọi ngay</a>
                    <a href={CONTACT.mapUrl} target="_blank" rel="noopener noreferrer" className="h-12 rounded-full border border-[#C9A24B]/60 text-[#F1D998] flex items-center justify-center gap-2 font-bold text-[13px] hover:bg-[#C9A24B]/15 hover:border-[#C9A24B] transition"><IconCompass className="w-4 h-4" /> Chỉ đường</a>

                    style={{ border: 0 }}
                    loading="lazy"
                    referrerPolicy="no-referrer-when-downgrade"
                  ></iframe>
                  <div className="absolute inset-0 pointer-events-none bg-gradient-to-t from-[#5C0E0F] via-[#5C0E0F]/10 to-transparent"></div>
                  <a href={CONTACT.mapUrl} target="_blank" rel="noopener noreferrer"
                    className="absolute left-4 right-4 bottom-4 sm:left-5 sm:right-5 sm:bottom-5 rounded-2xl bg-[#5C0E0F]/70 backdrop-blur-md border border-[#C9A24B]/40 px-5 py-4 flex items-center justify-between gap-4 hover:bg-[#5C0E0F]/85 hover:border-[#C9A24B]/70 transition">
                    <div className="flex items-center gap-3 min-w-0">
                      <div className="w-11 h-11 shrink-0 rounded-full bg-gradient-to-br from-[#F1D998] to-[#C9A24B] grid place-items-center shadow-[0_0_18px_rgba(201,162,75,0.4)]"><IconPin className="w-5 h-5" stroke="#5C0E0F" /></div>

          <footer className="relative bg-[#3A0A0B] text-white/70">
            <div className="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-[#C9A24B] to-transparent"></div>
            <div className="mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8 pt-12 pb-8">
              <div className="grid gap-10 md:grid-cols-3">
                {/* Cột 1: thương hiệu */}
                <div>
                  <div className="flex items-center gap-3">

                {/* Cột 2: liên kết nhanh */}

                  <div className="text-[11px] font-bold tracking-[0.2em] text-[#C9A24B]">LIÊN KẾT NHANH</div>
                  <div className="mt-4 grid gap-2.5">
                    {NAV.map(label => (
                      <button key={label} onClick={() => onNav(label)}
                        className="group text-left text-[12.5px] text-white/60 hover:text-[#F1D998] transition flex items-center gap-2">

                      </button>
                    ))}

                </div>

                {/* Cột 3: liên hệ */}

                  <div className="text-[11px] font-bold tracking-[0.2em] text-[#C9A24B]">THÔNG TIN LIÊN HỆ</div>
                  <div className="mt-4 grid gap-3 text-[12.5px]">
                    <div className="flex items-start gap-2.5 text-white/60 max-w-[280px]">
                      <IconPin className="w-4 h-4 mt-0.5 shrink-0" stroke="#C9A24B" /> {CONTACT.address}
                    </div>
                    <a href={`tel:${CONTACT.phone1.replace(/\./g, "")}`} className="flex items-center gap-2.5 text-white/60 hover:text-[#F1D998] font-semibold transition">
                      <IconPhone className="w-4 h-4 shrink-0" stroke="#C9A24B" /> {CONTACT.phone1}
                    </a>
                    <a href={`tel:${CONTACT.phone2.replace(/\./g, "")}`} className="flex items-center gap-2.5 text-white/60 hover:text-[#F1D998] font-semibold transition">
                      <IconPhone className="w-4 h-4 shrink-0" stroke="#C9A24B" /> {CONTACT.phone2}
                    </a>
                  </div>
                </div>
              </div>

              <div className="mt-10 pt-6 border-t border-[#C9A24B]/20 text-center text-white/40 text-[11px]">
                © 2026 Công ty Cổ phần Tập đoàn HTSON. Bảo lưu mọi quyền.
              </div>
            </div>
          </footer>

          <div className="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t-2 border-[#C9A24B]/40 px-3 py-2.5 flex gap-2 shadow-[0_-8px_24px_rgba(122,19,21,0.12)]">
            <a href={`tel:${CONTACT.phone1.replace(/\./g, "")}`} className="flex-1 h-12 rounded-full bg-gradient-to-r from-[#7A1315] to-[#5C0E0F] text-white flex items-center justify-center gap-2 font-bold text-[13px]"><IconPhone className="w-4 h-4" /> Gọi {CONTACT.phone1}</a>
            <button onClick={() => onNav("LIÊN HỆ")} className="flex-1 h-12 rounded-full bg-gradient-to-r from-[#C9A24B] via-[#F1D998] to-[#C9A24B] text-[#5C0E0F] grid place-items-center font-bold text-[13px]">Liên hệ</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
