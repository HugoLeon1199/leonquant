      const m = Math.floor((s % 3600) / 60).toString().padStart(2, "0");
      const sec = (s % 60).toString().padStart(2, "0");
      return `${h}:${m}:${sec}`;

        if (label.includes("BÁO GIÁ")) return scrollTo(formRef, "Nhận báo giá lăn bánh");

        const e = {};

          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(form)

        setForm(f => ({ name: "", phone: "", model: f.model, message: "" }));
      };

                    <a href="tel:0963888331" className="h-[54px] px-5 rounded-xl bg-white border border-black/10 text-[13px] font-bold flex items-center justify-center gap-2">
