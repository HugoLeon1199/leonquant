name: Tech Radar

on:
  schedule:
    - cron: "17 9 */3 * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .ci-run-tech
      - .github/workflows/tech-radar.yml
      - tech/**/*.py
      - tech/sql/**
      - tech/index.html
      - config/tech_sources_catalog.txt

permissions:
  contents: write
  actions: write

jobs:
  tech-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: tech-radar-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt
          pip install -r requirements-gdelt.txt

      - name: Restore standalone tech DuckDB cache
        uses: actions/cache@v4
        with:
          path: data/web_intel_tech.duckdb
          key: intel-tech-72h-v1-${{ hashFiles('tech/config/sources_active.txt', 'tech/reports/source_validation.json') }}-${{ github.run_id }}
          restore-keys: |
            intel-tech-72h-v1-

      - name: Validate source catalog
        run: python tech/validate_sources.py --resume

      - name: Crawl the latest 72 hours
        run: python tech/crawl.py

      - name: Write existing GCP credentials
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          test -n "$GCP_SA_JSON" || { echo "Missing existing GCP_SA_JSON secret"; exit 1; }
          printf '%s' "$GCP_SA_JSON" > credentials.json

      - name: Estimate 72h query cost
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: python tech/gdelt.py --dry-run --max-bytes-billed 2000000000

      - name: Run 72h technology query
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: python tech/gdelt.py --max-bytes-billed 2000000000

      - name: Build and validate the publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          python tech/publication.py
          python tech/validate_publication.py
          python tech/test_pipeline.py
          python tech/update_worklog.py

      - name: Mirror outputs for the existing Pages bundle
        run: |
          mkdir -p web
          cp tech/data/gdelt_pulse.json tech_gdelt_pulse.json
          cp tech/data/gdelt_pulse.json web/tech_gdelt_pulse.json
          cp tech/data/publication.json tech_publication.json
          cp tech/data/publication.json web/tech_publication.json

      - name: Remove temporary credentials
        if: always()
        run: rm -f credentials.json

      - name: Commit only standalone tech artifacts
        run: |
          git config user.name "tech-radar-bot"
          git config user.email "tech-radar-bot@users.noreply.github.com"
          git add \
            .ai/CURSOR_WORKLOG.md \
            tech/config/sources_active.txt \
            tech/config/sources_disabled.txt \
            tech/config/tiers \
            tech/config/tiers_manifest.json \
            tech/reports/source_validation.json \
            tech/reports/source_validation.md \
            tech/data/news_for_ai.json \
            tech/data/news_for_ai_clean.json \
            tech/data/gdelt_pulse.json \
            tech/data/publication.json \
            tech_gdelt_pulse.json web/tech_gdelt_pulse.json \
            tech_publication.json web/tech_publication.json
          if git diff --staged --quiet; then
            echo "No technology artifacts changed"
            exit 0
          fi
          git commit -m "Update Technology and AI 72h edition."
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git pull origin main --no-rebase --no-edit && git push origin main; then
              exit 0
            fi
            git merge --abort 2>/dev/null || true
            sleep 30
          done
          exit 1

      - name: Deploy through the existing Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
