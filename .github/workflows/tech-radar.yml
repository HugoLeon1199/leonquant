name: Tech Radar

on:
  schedule:
    - cron: "20 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tech-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: tech-radar-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Precheck validation report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/tech_source_validation.json")
          if not path.is_file():
              raise SystemExit("Missing reports/tech_source_validation.json. Run Phase 0 validation first.")
          data = json.loads(path.read_text(encoding="utf-8"))
          meta = data.get("validation_meta") or {}
          if not meta.get("report_valid"):
              raise SystemExit("tech_source_validation.json exists but report_valid=false")
          if int(meta.get("active_source_count") or 0) <= 0:
              raise SystemExit("No active sources in validation report.")
          print(f"Validation ready: active_sources={meta.get('active_source_count')}")
          PY

      - name: Install crawl + GDELT deps
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt
          pip install -r requirements-gdelt.txt

      - name: Restore tech DuckDB cache
        uses: actions/cache@v4
        id: cache-tech-db
        with:
          path: data/web_intel_tech.duckdb
          key: intel-tech-db-v1-${{ hashFiles('data/web_intel_tech.duckdb.gz', 'config/tech_sources_active.txt', 'config/tech_tiers/*.txt', 'reports/tech_source_validation.json') }}
          restore-keys: |
            intel-tech-db-v1-

      - name: Bootstrap tech DuckDB
        run: |
          mkdir -p data
          if [ ! -f data/web_intel_tech.duckdb ] && [ -f data/web_intel_tech.duckdb.gz ]; then
            gunzip -c data/web_intel_tech.duckdb.gz > data/web_intel_tech.duckdb
          fi

      - name: Crawl validated tech sources
        run: |
          python scripts/run_tech_intel_pipeline.py --skip-profile

      - name: Write GCP credentials
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          if [ -z "$GCP_SA_JSON" ]; then
            echo "Missing GCP_SA_JSON"
            exit 1
          fi
          printf '%s' "$GCP_SA_JSON" > credentials.json

      - name: Run tech GDELT pulse
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          python scripts/run_tech_gdelt.py

      - name: Build + validate tech publication
        run: |
          python scripts/build_tech_publication.py
          python scripts/validate_tech_publication.py
          python scripts/test_tech_pipeline.py

      - name: Commit tech artifacts
        run: |
          git config user.name "tech-radar-bot"
          git config user.email "tech-radar-bot@users.noreply.github.com"
          git add tech_news_output_today.json tech_news_output_all.json tech_news_for_ai.json tech_news_for_ai_clean.json tech_gdelt_pulse.json web/tech_gdelt_pulse.json tech_publication.json web/tech_publication.json
          if git diff --staged --quiet; then
            echo "No tech artifact changes"
            exit 0
          fi
          git commit -m "Update standalone tech radar artifacts."
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git pull origin main --no-rebase --no-edit && git push origin main; then
              exit 0
            fi
            git merge --abort 2>/dev/null || true
            sleep 30
          done
          exit 1

      - name: Save tech DuckDB cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/web_intel_tech.duckdb
          key: intel-tech-db-v1-${{ hashFiles('data/web_intel_tech.duckdb.gz', 'config/tech_sources_active.txt', 'config/tech_tiers/*.txt', 'reports/tech_source_validation.json') }}
