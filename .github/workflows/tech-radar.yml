name: Tech Radar

on:
  schedule:
    - cron: "20 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tech-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: tech-radar-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Precheck validation report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("tech/reports/source_validation.json")
          if not path.is_file():
              raise SystemExit("Missing tech/reports/source_validation.json. Run Phase 0 validation first.")
          data = json.loads(path.read_text(encoding="utf-8"))
          meta = data.get("validation_meta") or {}
          if not meta.get("report_valid"):
              raise SystemExit("tech_source_validation.json exists but report_valid=false")
          if int(meta.get("active_source_count") or 0) <= 0:
              raise SystemExit("No active sources in validation report.")
          print(f"Validation ready: active_sources={meta.get('active_source_count')}")
          PY

      - name: Check 72h publish gate
        id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          def set_output(key: str, value: str) -> None:
              with output_path.open("a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")

          path = Path("tech/data/publication.json")
          if not path.is_file():
              set_output("run_publish", "true")
              set_output("age_hours", "9999")
              print("Missing publication artifact, running tech refresh.")
              raise SystemExit(0)

          payload = json.loads(path.read_text(encoding="utf-8"))
          stamp = str(payload.get("generated_at_utc") or payload.get("generated_at") or "").strip()
          if not stamp:
              set_output("run_publish", "true")
              set_output("age_hours", "9999")
              print("Publication has no timestamp, running tech refresh.")
              raise SystemExit(0)
          dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
          if dt.tzinfo is None:
              dt = dt.replace(tzinfo=timezone.utc)
          age_hours = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 3600.0
          manual_dispatch = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          run_publish = manual_dispatch or age_hours >= 72.0
          set_output("run_publish", "true" if run_publish else "false")
          set_output("age_hours", f"{age_hours:.2f}")
          print(f"Tech publish age {age_hours:.1f}h; manual_dispatch={manual_dispatch}; run_publish={run_publish}.")
          if not run_publish:
              print(f"Tech publish age {age_hours:.1f}h < 72h, refreshing data only.")
          PY

      - name: Install crawl + GDELT deps
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt
          pip install -r requirements-gdelt.txt

      - name: Restore tech DuckDB cache
        uses: actions/cache@v4
        id: cache-tech-db
        with:
          path: tech/data/web_intel_tech.duckdb
          key: intel-tech-db-v1-${{ hashFiles('tech/data/web_intel_tech.duckdb.gz', 'tech/config/sources_active.txt', 'tech/config/frontier_watchlist.json', 'tech/config/tech_tiers/*.txt', 'tech/reports/source_validation.json') }}
          restore-keys: |
            intel-tech-db-v1-

      - name: Bootstrap tech DuckDB
        run: |
          mkdir -p tech/data
          if [ ! -f tech/data/web_intel_tech.duckdb ] && [ -f tech/data/web_intel_tech.duckdb.gz ]; then
            gunzip -c tech/data/web_intel_tech.duckdb.gz > tech/data/web_intel_tech.duckdb
          fi

      - name: Crawl validated tech sources
        run: |
          python tech/crawl.py

      - name: Write GCP credentials
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          if [ -z "$GCP_SA_JSON" ]; then
            echo "Missing GCP_SA_JSON"
            exit 1
          fi
          printf '%s' "$GCP_SA_JSON" > credentials.json

      - name: Run tech GDELT pulse
        id: gdelt
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          if [ -z "$GOOGLE_CLOUD_PROJECT" ]; then
            echo "Missing GOOGLE_CLOUD_PROJECT"
            exit 1
          fi
          DRYRUN_OUTPUT="$(python tech/gdelt.py --dry-run)"
          echo "$DRYRUN_OUTPUT"
          ESTIMATED_BYTES="$(printf '%s' "$DRYRUN_OUTPUT" | sed -n 's/.*estimated_bytes=\([0-9][0-9]*\).*/\1/p')"
          if [ -z "$ESTIMATED_BYTES" ]; then
            echo "Could not parse dry-run estimated bytes"
            exit 1
          fi
          echo "estimated_bytes=$ESTIMATED_BYTES" >> "$GITHUB_OUTPUT"
          TECH_GDELT_ESTIMATED_BYTES="$ESTIMATED_BYTES" python tech/gdelt.py

      - name: Build + validate tech publication
        if: steps.gate.outputs.run_publish == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          python tech/publication.py
          python tech/validate_publication.py
          python tech/test_pipeline.py

      - name: Refresh rolling tech candidates
        if: steps.gate.outputs.run_publish != 'true'
        env:
          LEON_TECH_OFFLINE_TEST: "1"
        run: |
          python tech/publication.py --output .tmp_tech_publication.json --web-output .tmp_tech_publication_web.json
          rm -f .tmp_tech_publication.json .tmp_tech_publication_web.json

      - name: Update tech worklog
        run: |
          python tech/update_worklog.py

      - name: Commit tech artifacts
        run: |
          git config user.name "tech-radar-bot"
          git config user.email "tech-radar-bot@users.noreply.github.com"
          git add .ai/CURSOR_WORKLOG.md tech/config/frontier_watchlist.json tech/config/sources_active.txt tech/config/sources_disabled.txt tech/config/tech_tiers/*.txt tech/config/tech_tiers_manifest.json tech/reports/source_validation.json tech/reports/source_validation.md tech/reports/source_coverage_matrix.md tech/data/candidates_rolling.json tech/data/watchlist_status.json tech/data/news_output_today.json tech/data/news_output_all.json tech/data/news_for_ai.json tech/data/news_for_ai_clean.json tech/data/gdelt_pulse.json tech/web/gdelt_pulse.json
          if [ "${{ steps.gate.outputs.run_publish }}" = "true" ]; then
            git add tech/data/publication.json tech/web/publication.json
          fi
          if git diff --staged --quiet; then
            echo "No tech artifact changes"
            exit 0
          fi
          git commit -m "Update standalone tech radar artifacts."
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git pull origin main --no-rebase --no-edit && git push origin main; then
              exit 0
            fi
            git merge --abort 2>/dev/null || true
            sleep 30
          done
          exit 1

      - name: Save tech DuckDB cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: tech/data/web_intel_tech.duckdb
          key: intel-tech-db-v1-${{ hashFiles('tech/data/web_intel_tech.duckdb.gz', 'tech/config/sources_active.txt', 'tech/config/frontier_watchlist.json', 'tech/config/tech_tiers/*.txt', 'tech/reports/source_validation.json') }}
