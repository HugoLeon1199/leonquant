name: Refresh source profiles monthly

on:
  schedule:
    - cron: "0 21 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-profiles:
    concurrency:
      group: refresh-source-profiles-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install profiler dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt

      - name: Rebuild source profiles from seeds
        run: |
          rm -f data/web_intel_leonquant.duckdb
          python leon_web_intel/run_profile.py \
            --input config/sources_seed.txt \
            --profile-only \
            --db data/web_intel_leonquant.duckdb \
            --force-refresh

      - name: Pack git seed (profiles only)
        run: |
          python scripts/pack_db_seed.py \
            --db data/web_intel_leonquant.duckdb \
            --mode profiles-only

      - name: Commit refreshed seed
        run: |
          git config user.name "profile-refresh-bot"
          git config user.email "profile-refresh-bot@users.noreply.github.com"
          git add data/web_intel_leonquant.duckdb.gz
          if git diff --staged --quiet; then
            echo "No profile seed changes"
            exit 0
          fi
          git commit -m "Refresh source profile seed."
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git pull origin main --no-rebase --no-edit && git push origin main; then
              exit 0
            fi
            git merge --abort 2>/dev/null || true
            echo "Push attempt ${attempt} failed; retry in 30s..."
            sleep 30
          done
          exit 1
