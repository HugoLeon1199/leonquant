name: Refresh tech source profiles monthly

on:
  schedule:
    - cron: "43 9 1 * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-tech-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: refresh-tech-profiles-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing crawler dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt

      - name: Revalidate the source catalog
        run: python tech/validate_sources.py --force-refresh

      - name: Rebuild standalone tech profiles
        run: |
          rm -f data/web_intel_tech.duckdb
          python leon_web_intel/run_profile.py \
            --input tech/config/sources_active.txt \
            --profile-only \
            --db data/web_intel_tech.duckdb \
            --force-refresh

      - name: Pack profiles-only seed
        run: |
          python scripts/pack_db_seed.py \
            --db data/web_intel_tech.duckdb \
            --output data/web_intel_tech.duckdb.gz \
            --mode profiles-only

      - name: Commit validation and profile seed
        run: |
          git config user.name "tech-profile-refresh-bot"
          git config user.email "tech-profile-refresh-bot@users.noreply.github.com"
          git add \
            tech/config/sources_active.txt \
            tech/config/sources_disabled.txt \
            tech/config/tiers \
            tech/config/tiers_manifest.json \
            tech/reports/source_validation.json \
            tech/reports/source_validation.md \
            data/web_intel_tech.duckdb.gz
          if git diff --staged --quiet; then
            echo "No profile changes"
            exit 0
          fi
          git commit -m "Refresh standalone technology source profiles."
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git pull origin main --no-rebase --no-edit && git push origin main; then
              exit 0
            fi
            git merge --abort 2>/dev/null || true
            sleep 30
          done
          exit 1
