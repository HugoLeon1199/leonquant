# Bật GitHub Pages: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Lần đầu phải chọn nguồn "GitHub Actions" trong Settings (repo quyền write).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle static site (chỉ file web, không upload cả repo)
        run: |
          python3 -m json.tool content.json > /dev/null
          mkdir -p _site/landing_page
          # Một nguồn: landing_page.html → trang chủ, /landing_page.html, /landing_page/
          cp landing_page.html _site/index.html
          cp landing_page.html _site/landing_page.html
          cp landing_page.html _site/landing_page/index.html
          cp content.json _site/
          cp feed-config.json _site/ 2>/dev/null || true
          cp .nojekyll _site/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Nhúng brief + tin vào HTML (hiển thị ngay cả khi fetch/JS lỗi)
        run: |
          node scripts/embed_public_brief_into_html.mjs _site/index.html _site/content.json
          node scripts/embed_public_brief_into_html.mjs _site/landing_page.html _site/content.json
          node scripts/embed_public_brief_into_html.mjs _site/landing_page/index.html _site/content.json

      - name: Verify embedded brief (fail nếu HTML thiếu brief)
        run: |
          grep -Fq 'Luận điểm chính hôm nay' _site/index.html
          grep -Fq 'data-embedded-brief="1"' _site/index.html
          grep -Fq 'Hành động nhanh hôm nay' _site/index.html
          grep -Fq 'Phân bổ vốn tham khảo' _site/index.html
          grep -Fq 'Kế hoạch theo 3 kịch bản' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Không dùng secrets trong `if:` (GitHub từ chối parse workflow).
      # Bật purge: thêm CF_ZONE_ID + CF_API_TOKEN (Cache Purge:Edit); thiếu secret → bỏ qua.
      - name: Purge Cloudflare cache (optional — cần CF_ZONE_ID + CF_API_TOKEN)
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "Skip Cloudflare purge (set CF_ZONE_ID + CF_API_TOKEN để bật)."
            exit 0
          fi
          curl -sS -f -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["leonquant.com","www.leonquant.com"]}'
