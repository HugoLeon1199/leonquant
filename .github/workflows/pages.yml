# Bật GitHub Pages: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Lần đầu phải chọn nguồn "GitHub Actions" trong Settings (repo quyền write).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commit từ Daily digest (GITHUB_TOKEN) không kích hoạt push → Pages; chạy lại sau digest xong.
  workflow_run:
    workflows: ["Tin Việt Nam 48h digest", "LIVE pulse 12h"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Luôn dựng lại content.json từ gemini_digest_summary + news_for_ai_clean trong repo;
      # tránh deploy HTML mới nhưng content.json cũ (thiếu trường → brief trống/sai).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps (DuckDB published_at enrich)
        run: pip install duckdb pandas

      - name: Bootstrap DuckDB seed (published_at / extracted_at cho link)
        run: |
          mkdir -p data
          if [ ! -f data/web_intel_leonquant.duckdb ] && [ -f data/web_intel_leonquant.duckdb.gz ]; then
            gunzip -c data/web_intel_leonquant.duckdb.gz > data/web_intel_leonquant.duckdb
            echo "Bootstrapped DuckDB ($(du -h data/web_intel_leonquant.duckdb | cut -f1))"
          fi

      - name: Dựng content.json (từ gemini_digest_summary + bài đã lọc)
        run: |
          cp content.json content.json.repo
          python3 build_website_content.py \
            --digest-input gemini_digest_summary.json \
            --enriched-input news_for_ai_clean.json \
            --skip-images
          python3 scripts/merge_link_published_at.py content.json.repo content.json
          python3 -c "
          import json
          d = json.load(open('content.json', encoding='utf-8'))
          idx = d.get('articleLinkIndex') or []
          n = sum(1 for a in idx if str(a.get('publishedAt') or '').strip())
          assert n >= max(10, len(idx) // 20), f'articleLinkIndex thiếu publishedAt ({n}/{len(idx)})'
          "

      - name: Kiểm tra content.json
        run: |
          python3 -m json.tool content.json > /dev/null
          python3 validate_content.py --content-only --content-input content.json

      - name: Bundle static site (chỉ file web, không upload cả repo)
        run: |
          mkdir -p _site/landing_page
          # Một nguồn: landing_page.html → trang chủ, /landing_page.html, /landing_page/
          cp landing_page.html _site/index.html
          cp landing_page.html _site/landing_page.html
          cp landing_page.html _site/landing_page/index.html
          cp content.json _site/
          mkdir -p _site/web
          cp market_pulse.json _site/market_pulse.json 2>/dev/null || true
          cp web/market_pulse.json _site/web/market_pulse.json 2>/dev/null || true
          cp invest_pulse.json _site/invest_pulse.json 2>/dev/null || true
          cp web/invest_pulse.json _site/web/invest_pulse.json 2>/dev/null || true
          cp invest_vn_brief.json _site/invest_vn_brief.json 2>/dev/null || true
          cp web/invest_vn_brief.json _site/web/invest_vn_brief.json 2>/dev/null || true
          cp invest_world_pulse.json _site/invest_world_pulse.json 2>/dev/null || true
          cp web/invest_world_pulse.json _site/web/invest_world_pulse.json 2>/dev/null || true
          cp feed-config.json _site/ 2>/dev/null || true
          cp .nojekyll _site/
          cp -r assets _site/assets 2>/dev/null || true
          # Custom domain (Settings → Pages → Custom domain phải khớp DNS)
          echo "leonquant.com" > _site/CNAME

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Nhúng brief + tin vào HTML (hiển thị ngay cả khi fetch/JS lỗi)
        run: |
          python3 scripts/sanitize_newsroom_content_json.py _site/content.json
          node scripts/embed_public_brief_into_html.mjs _site/index.html _site/content.json
          node scripts/embed_public_brief_into_html.mjs _site/landing_page.html _site/content.json
          node scripts/embed_public_brief_into_html.mjs _site/landing_page/index.html _site/content.json
          if [ -f _site/market_pulse.json ]; then
            node scripts/embed_public_pulse_into_html.mjs _site/index.html _site/market_pulse.json
            node scripts/embed_public_pulse_into_html.mjs _site/landing_page.html _site/market_pulse.json
            node scripts/embed_public_pulse_into_html.mjs _site/landing_page/index.html _site/market_pulse.json
          fi
          if [ -f _site/invest_vn_brief.json ]; then
            node scripts/embed_public_invest_vn_into_html.mjs _site/index.html _site/invest_vn_brief.json
            node scripts/embed_public_invest_vn_into_html.mjs _site/landing_page.html _site/invest_vn_brief.json
            node scripts/embed_public_invest_vn_into_html.mjs _site/landing_page/index.html _site/invest_vn_brief.json
          fi
          for f in _site/index.html _site/landing_page.html _site/landing_page/index.html; do
            python3 scripts/fix_brief_pulse_invest_layout.py "$f"
          done

      - name: Verify embedded brief (fail nếu HTML thiếu brief)
        run: |
          grep -Fq 'data-embedded-brief="1"' _site/index.html
          grep -Fq 'class="digest-mode"' _site/index.html
          if [ -f _site/market_pulse.json ]; then
            grep -Fq 'id="sectionPulse"' _site/index.html
            grep -Fq 'NÓNG TOÀN CẦU' _site/index.html
          fi
          python3 scripts/verify_deployed_html_layout.py _site/index.html
          # Digest: multisector hoặc newsroom brief (marker khác nhau trong HTML nhúng)
          python3 -c "
          import json
          from pathlib import Path
          d = json.load(open('content.json', encoding='utf-8'))
          html = Path('_site/index.html').read_text(encoding='utf-8')
          m = d.get('briefMode')
          assert m in ('multisector-digest', 'newsroom-brief'), m
          if m == 'newsroom-brief':
            assert 'Bản tin 48' in html or 'issue-header' in html, 'newsroom layout missing in embedded HTML'
            assert 'Front Page' not in html, 'newsroom labels should be Vietnamese'
            assert len(d.get('frontPage') or []) >= 1
            assert len(d.get('sectorDeepBriefs') or []) >= 4
          else:
            assert 'Bấm vào xem chi tiết' in html, 'multisector archive missing'
            assert len(d.get('digestSectors') or []) >= 4
          "

      - uses: actions/configure-pages@v5

      # Tránh NET::ERR_CERT_COMMON_NAME_INVALID: bắt buộc đăng ký cname trên repo Pages
      # (chỉ file _site/CNAME không đủ — GitHub phải cấp Let's Encrypt cho leonquant.com).
      - name: Đăng ký custom domain + bật HTTPS (Pages API)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          curl -fsSL -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" \
            -d '{"cname":"leonquant.com","https_enforced":true,"build_type":"workflow"}'
          echo "Pages config sau khi PUT:"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" | python3 -c "import json,sys; p=json.load(sys.stdin); c=p.get('https_certificate') or {}; print('cname=',p.get('cname')); print('https_enforced=',p.get('https_enforced')); print('cert_state=',c.get('state')); print('cert_domains=',c.get('domains'))"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Purge Cloudflare: làm tay trên dashboard sau deploy, hoặc dùng rule cache riêng.
      # (Không gọi API purge ở đây — tránh workflow phải tham chiếu secrets trong step/env.)
