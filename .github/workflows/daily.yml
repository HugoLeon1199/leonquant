name: Daily Macro Brief

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify pipeline scripts compile
        run: |
          python -m py_compile finalize_summary_gpt.py build_website_content.py validate_content.py fetch_market_snapshot.py summarize_news_gemini.py crawl_financial_news.py scripts/validate_news_sources_tiered.py scripts/build_news_sources_tiered.py

      - name: Validate tiered RSS config
        run: python scripts/validate_news_sources_tiered.py

      - name: Crawl public macro news
        run: |
          python crawl_financial_news.py --sources config/news_sources_tiered.json --per-source-limit 0 --max-total 0 --today-only --macro-only --macro-min-score 4

      - name: Fetch market snapshot (best-effort quotes)
        run: |
          python fetch_market_snapshot.py

      - name: Summarize source articles with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          python summarize_news_gemini.py --max-articles 40

      - name: Final editorial pass with GPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          python finalize_summary_gpt.py --skip-web-verify

      - name: Build public website content
        run: |
          python build_website_content.py --metadata-timeout 14

      - name: Validate JSON artifacts
        run: |
          python -m json.tool market_snapshot.json > /dev/null
          python -m json.tool final_summary.json > /dev/null
          python -m json.tool content.json > /dev/null
          python validate_content.py

      - name: Commit updated brief
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add news_output.json enriched_news.json gemini_summary.json market_snapshot.json final_summary.json content.json feed-config.json
          git commit -m "Update daily macro brief" || echo "No content changes to commit"
          git push
