name: Tin Việt Nam 48h digest

# 05:00 Asia/Ho_Chi_Minh mỗi ngày = 22:00 UTC ngày trước.
# Profile đã phân loại (cache/seed) → Scrapy 48h → export → Gemini → content.json
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .ci-run-digest
      - .github/workflows/daily.yml
      - data/web_intel_leonquant.duckdb.gz

permissions:
  contents: write

concurrency:
  group: tin-viet-nam-48h-digest
  cancel-in-progress: true

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt

      - name: Restore DuckDB (profiles + articles)
        uses: actions/cache@v4
        id: cache-intel-db
        with:
          path: data/web_intel_leonquant.duckdb
          key: intel-digest-db-v2-${{ hashFiles('data/web_intel_leonquant.duckdb.gz', 'config/sources_seed.txt', 'leon_web_intel/config/crawl_rules.yaml', 'config/tiers/*.txt') }}
          restore-keys: |
            intel-digest-db-v2-
            intel-digest-db-v1-
            intel-profiles-v7-

      - name: Prepare DuckDB
        run: |
          mkdir -p data
          if [ ! -f data/web_intel_leonquant.duckdb ] && [ -f data/web_intel_leonquant.duckdb.gz ]; then
            gunzip -c data/web_intel_leonquant.duckdb.gz > data/web_intel_leonquant.duckdb
            echo "Decompressed seed DB ($(du -h data/web_intel_leonquant.duckdb | cut -f1))"
          fi
          if [ ! -f data/web_intel_leonquant.duckdb ]; then
            echo "ERROR: no DuckDB — add data/web_intel_leonquant.duckdb.gz to the repo or restore Actions cache." >&2
            exit 2
          fi
          python -c "
          import duckdb
          c = duckdb.connect('data/web_intel_leonquant.duckdb', read_only=True)
          profiles = int(c.execute('SELECT COUNT(*) FROM source_profiles').fetchone()[0])
          articles = int(c.execute('SELECT COUNT(*) FROM articles').fetchone()[0])
          c.close()
          print(f'source_profiles={profiles} articles={articles}')
          assert profiles >= 50, 'need classified source_profiles (seed DB or prior profile run)'
          "

      - name: Profile missing sources only (first-time / empty DB)
        id: profile_if_needed
        run: |
          NEED=$(python -c "
          import duckdb
          c = duckdb.connect('data/web_intel_leonquant.duckdb', read_only=True)
          n = int(c.execute('SELECT COUNT(*) FROM source_profiles').fetchone()[0])
          c.close()
          print('yes' if n < 50 else 'no')
          ")
          echo "profile_needed=$NEED" >> "$GITHUB_OUTPUT"
          if [ "$NEED" = "yes" ]; then
            python -m playwright install --with-deps chromium
            cd leon_web_intel
            python run_profile.py \
              --input ../config/sources_seed.txt \
              --profile-only \
              --db ../data/web_intel_leonquant.duckdb
          else
            echo "Skip profile: source_profiles already in DuckDB."
          fi

      - name: Pin calendar date
        run: |
          echo "CRAWL_CALENDAR_DATE=$(python scripts/pin_crawl_calendar_date.py --date today --timezone Asia/Ho_Chi_Minh)" >> "$GITHUB_ENV"
          echo "Pinned crawl/export date: $CRAWL_CALENDAR_DATE"

      - name: Ensure DuckDB has enough articles in 48h window
        continue-on-error: true
        run: |
          python scripts/ensure_db_48h_articles.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --recent-calendar-days 2 \
            --min 5 || echo "WARN: pre-crawl ensure; will re-check after crawl."

      # Crawl có thể cảnh báo/thoát sớm trên runner; digest bước sau dùng cửa sổ 48h trong DB.
      - name: Crawl 48h news (classified profiles, no wipe)
        id: crawl
        continue-on-error: true
        env:
          WEB_INTEL_RECENT_CALENDAR_DAYS: "2"
        run: |
          python scripts/run_intel_full_daily.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --skip-profile \
            --no-crawl-skip || echo "WARN: crawl step exited non-zero; continuing with DB digest."

      - name: Verify articles for digest export (re-seed if cache too stale)
        run: |
          python scripts/ensure_db_48h_articles.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --recent-calendar-days 2 \
            --min 5

      - name: Gemini digest and build web content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_LOOP_FORCE: "1"
        run: |
          python scripts/run_digest_from_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --recent-calendar-days 14 \
            --min-clean-articles 1

      - name: Prune DuckDB to 48h window (keep cache small)
        run: |
          python scripts/prune_intel_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --recent-calendar-days 7

      - name: Commit updated digest
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add news_for_ai_clean.json gemini_digest_summary.json content.json
          git commit -m "Update daily news digest (crawl + Gemini + web)" || echo "No content changes to commit"
          git push
