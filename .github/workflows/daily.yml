name: Daily Macro Brief

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Leon Web Intel (Scrapy) dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache Intel DuckDB (skip re-profile when config unchanged)
        uses: actions/cache@v4
        id: cache-intel-db
        with:
          path: data/web_intel_leonquant.duckdb
          key: intel-db-${{ hashFiles('config/sources_seed.txt', 'leon_web_intel/config/crawl_rules.yaml', 'config/tiers/*.txt') }}

      - name: Verify pipeline scripts compile
        run: |
          python -m py_compile macro_relevance.py build_website_content.py validate_content.py fetch_market_snapshot.py summarize_news_gemini.py scripts/run_intel_full_daily.py scripts/export_intel_to_news_output.py scripts/export_news_full_for_ai.py scripts/clean_news_for_ai.py scripts/run_daily_brief.py scripts/run_digest_loop.py scripts/test_gemini_digest_preflight.py leon_web_intel/run_profile.py leon_web_intel/run_scrapy.py

      - name: Crawl macro news (Leon Web Intel)
        run: |
          EXTRA=""
          if [ "${{ steps.cache-intel-db.outputs.cache-hit }}" = "true" ]; then
            EXTRA="--skip-profile"
          fi
          python scripts/run_intel_full_daily.py --date today --timezone Asia/Ho_Chi_Minh $EXTRA

      - name: Export and clean articles for AI
        run: |
          python scripts/export_news_full_for_ai.py --date today --recent-calendar-days 2
          python scripts/clean_news_for_ai.py

      - name: Fetch market snapshot (best-effort)
        run: python fetch_market_snapshot.py

      - name: Gemini batch digest (free-tier loop)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: python scripts/run_digest_loop.py

      - name: Build public website content
        run: |
          python build_website_content.py \
            --digest-input gemini_digest_summary.json \
            --enriched-input news_for_ai_clean.json \
            --skip-images

      - name: Validate JSON artifacts
        run: |
          python -m json.tool gemini_digest_summary.json > /dev/null
          python -m json.tool content.json > /dev/null
          python validate_content.py --content-only --content-input content.json

      - name: Commit updated brief
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add news_output_today.json news_output_all.json news_for_ai_clean.json gemini_digest_summary.json gemini_digest_outline.json market_snapshot.json content.json feed-config.json
          git commit -m "Update daily macro brief (crawl + Gemini digest)" || echo "No content changes to commit"
          git push
