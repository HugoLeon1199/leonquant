name: Tin Việt Nam 48h digest

# 05:00 VN = 22:00 UTC. Git: chỉ data/web_intel_leonquant.duckdb.gz (profiles, nhỏ).
# Articles: GitHub Actions cache — không xóa toàn bộ bài trước crawl.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .ci-run-digest
      - .github/workflows/daily.yml
      - data/web_intel_leonquant.duckdb.gz
      - config/sources_seed.txt
      - config/tiers/*.txt

permissions:
  contents: write

concurrency:
  group: tin-viet-nam-48h-digest
  cancel-in-progress: true

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt

      - name: Restore DuckDB cache (source_profiles + bài 48h)
        uses: actions/cache@v4
        id: cache-intel-db
        with:
          path: data/web_intel_leonquant.duckdb
          key: intel-digest-db-v4-${{ hashFiles('data/web_intel_leonquant.duckdb.gz', 'config/sources_seed.txt', 'leon_web_intel/config/crawl_rules.yaml', 'config/tiers/*.txt') }}
          restore-keys: |
            intel-digest-db-v4-
            intel-digest-db-v3-

      - name: Bootstrap DuckDB (profiles từ .gz nếu chưa có cache)
        run: |
          mkdir -p data
          if [ ! -f data/web_intel_leonquant.duckdb ] && [ -f data/web_intel_leonquant.duckdb.gz ]; then
            gunzip -c data/web_intel_leonquant.duckdb.gz > data/web_intel_leonquant.duckdb
            echo "Decompressed seed ($(du -h data/web_intel_leonquant.duckdb | cut -f1))"
          fi
          if [ ! -f data/web_intel_leonquant.duckdb ]; then
            echo "ERROR: no DuckDB — cần .duckdb.gz (profiles) hoặc cache Actions." >&2
            exit 2
          fi
          python -c "
          import duckdb
          c = duckdb.connect('data/web_intel_leonquant.duckdb', read_only=True)
          p = int(c.execute('SELECT COUNT(*) FROM source_profiles').fetchone()[0])
          a = int(c.execute('SELECT COUNT(*) FROM articles').fetchone()[0])
          r = int(c.execute('''
            SELECT COUNT(*) FROM articles
            WHERE extracted_at >= CURRENT_TIMESTAMP - INTERVAL 48 HOUR
              AND COALESCE(content_length, 0) >= 200
          ''').fetchone()[0])
          c.close()
          print(f'source_profiles={p} articles_total={a} rolling_48h>={r}')
          assert p >= 10, 'Thiếu source_profiles — pack_db_seed.py --mode profiles-only'
          "

      - name: Pin calendar date
        run: |
          echo "CRAWL_CALENDAR_DATE=$(python scripts/pin_crawl_calendar_date.py --date today --timezone Asia/Ho_Chi_Minh)" >> "$GITHUB_ENV"
          echo "Pinned: $CRAWL_CALENDAR_DATE"

      - name: Crawl 48h news (incremental — giữ cache, không wipe bài)
        id: crawl
        continue-on-error: true
        env:
          WEB_INTEL_RECENT_CALENDAR_DAYS: "2"
        run: |
          python scripts/run_intel_full_daily.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --skip-profile \
            --no-crawl-skip \
            || echo "WARN: crawl exited non-zero; gate step checks 48h article window next."

      - name: Prepare digest export window (gate — bắt buộc pass trước Gemini)
        run: |
          python scripts/prepare_digest_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --min-articles 5

      - name: Gemini digest and build web content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_LOOP_FORCE: "1"
        run: |
          pip install -q google-generativeai
          python scripts/run_digest_from_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --min-clean-articles 5

      - name: Prune DuckDB (cùng cửa sổ export — cache nhỏ cho lần sau)
        run: |
          python scripts/prune_intel_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh

      - name: Commit updated digest
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add news_for_ai_clean.json gemini_digest_summary.json content.json invest_vn_brief.json web/invest_vn_brief.json
          git commit -m "Update daily news digest (crawl + Gemini + web + invest VN brief)" || echo "No content changes to commit"
          git push
