name: Tin Việt Nam 48h digest

# Digest only: DuckDB → export → Gemini → content.json (no crawl).
# Lịch: 05:00 VN = 22:00 UTC ngày trước.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .ci-run-digest
      - .github/workflows/daily.yml
      - data/web_intel_leonquant.duckdb.gz

permissions:
  contents: write

concurrency:
  group: tin-viet-nam-48h-digest
  cancel-in-progress: true

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt

      - name: Restore DuckDB (articles + profiles)
        uses: actions/cache@v4
        id: cache-intel-db
        with:
          path: data/web_intel_leonquant.duckdb
          key: intel-digest-db-v1-${{ hashFiles('data/web_intel_leonquant.duckdb.gz', 'config/sources_seed.txt', 'leon_web_intel/config/crawl_rules.yaml') }}
          restore-keys: |
            intel-digest-db-v1-
            intel-profiles-v7-

      - name: Prepare DuckDB from repo seed
        run: |
          mkdir -p data
          if [ ! -f data/web_intel_leonquant.duckdb ] && [ -f data/web_intel_leonquant.duckdb.gz ]; then
            gunzip -c data/web_intel_leonquant.duckdb.gz > data/web_intel_leonquant.duckdb
            echo "Decompressed seed DB ($(du -h data/web_intel_leonquant.duckdb | cut -f1))"
          fi
          python -c "
          import duckdb
          c=duckdb.connect('data/web_intel_leonquant.duckdb', read_only=True)
          n=c.execute('SELECT COUNT(*) FROM articles').fetchone()[0]
          c.close()
          print(f'articles in DB: {n}')
          assert n>=5, 'need at least 5 articles in DuckDB'
          "

      - name: Pin calendar date
        run: |
          echo "CRAWL_CALENDAR_DATE=$(python scripts/pin_crawl_calendar_date.py --date today --timezone Asia/Ho_Chi_Minh)" >> "$GITHUB_ENV"
          echo "Pinned date: $CRAWL_CALENDAR_DATE"

      - name: Digest from DuckDB (export → Gemini → web)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_LOOP_FORCE: "1"
        run: |
          python scripts/run_digest_from_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --recent-calendar-days 2

      - name: Commit updated digest
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add news_for_ai_clean.json gemini_digest_summary.json content.json
          git commit -m "Update daily news digest (DB → Gemini → web)" || echo "No content changes to commit"
          git push
