name: Tin Việt Nam 48h digest

# 05:00 Asia/Ho_Chi_Minh mỗi ngày = 22:00 UTC ngày trước.
# Git: chỉ data/web_intel_leonquant.duckdb.gz (gzip, nên profiles-only ~nhỏ).
# Articles: GitHub Actions cache data/web_intel_leonquant.duckdb — không commit DB thô.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .ci-run-digest
      - .github/workflows/daily.yml
      - data/web_intel_leonquant.duckdb.gz

permissions:
  contents: write

concurrency:
  group: tin-viet-nam-48h-digest
  cancel-in-progress: true

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt

      - name: Restore DuckDB (profiles + articles)
        uses: actions/cache@v4
        id: cache-intel-db
        with:
          path: data/web_intel_leonquant.duckdb
          key: intel-digest-db-v3-${{ hashFiles('data/web_intel_leonquant.duckdb.gz', 'config/sources_seed.txt', 'leon_web_intel/config/crawl_rules.yaml', 'config/tiers/*.txt') }}
          restore-keys: |
            intel-digest-db-v3-
            intel-digest-db-v2-

      - name: Prepare DuckDB from git seed
        run: |
          mkdir -p data
          if [ ! -f data/web_intel_leonquant.duckdb ] && [ -f data/web_intel_leonquant.duckdb.gz ]; then
            gunzip -c data/web_intel_leonquant.duckdb.gz > data/web_intel_leonquant.duckdb
            echo "Decompressed seed DB ($(du -h data/web_intel_leonquant.duckdb | cut -f1))"
          fi
          if [ ! -f data/web_intel_leonquant.duckdb ]; then
            echo "ERROR: no DuckDB — add data/web_intel_leonquant.duckdb.gz or restore Actions cache." >&2
            exit 2
          fi
          python -c "
          import duckdb
          c = duckdb.connect('data/web_intel_leonquant.duckdb', read_only=True)
          profiles = int(c.execute('SELECT COUNT(*) FROM source_profiles').fetchone()[0])
          articles = int(c.execute('SELECT COUNT(*) FROM articles').fetchone()[0])
          c.close()
          print(f'source_profiles={profiles} articles={articles}')
          assert profiles >= 50, 'need classified source_profiles in .duckdb.gz seed'
          "

      - name: Profile missing sources only (first-time / empty DB)
        run: |
          NEED=$(python -c "
          import duckdb
          c = duckdb.connect('data/web_intel_leonquant.duckdb', read_only=True)
          n = int(c.execute('SELECT COUNT(*) FROM source_profiles').fetchone()[0])
          c.close()
          print('yes' if n < 50 else 'no')
          ")
          if [ "$NEED" = "yes" ]; then
            python -m playwright install --with-deps chromium
            cd leon_web_intel
            python run_profile.py \
              --input ../config/sources_seed.txt \
              --profile-only \
              --db ../data/web_intel_leonquant.duckdb
          else
            echo "Skip profile: source_profiles already in DuckDB."
          fi

      - name: Pin calendar date
        run: |
          echo "CRAWL_CALENDAR_DATE=$(python scripts/pin_crawl_calendar_date.py --date today --timezone Asia/Ho_Chi_Minh)" >> "$GITHUB_ENV"
          echo "Pinned crawl/export date: $CRAWL_CALENDAR_DATE"

      - name: Crawl 48h news
        env:
          WEB_INTEL_RECENT_CALENDAR_DAYS: "2"
        run: |
          python scripts/run_intel_full_daily.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --skip-profile \
            --no-crawl-skip \
            --require-today-articles 5

      - name: Prepare digest export window (gate — must pass before Gemini)
        run: |
          python scripts/prepare_digest_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --min-articles 10

      - name: Gemini digest and build web content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_LOOP_FORCE: "1"
        run: |
          python scripts/run_digest_from_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh \
            --min-clean-articles 10

      - name: Prune DuckDB (match export window — keeps cache small, never empty wipe)
        run: |
          python scripts/prune_intel_db.py \
            --date "$CRAWL_CALENDAR_DATE" \
            --timezone Asia/Ho_Chi_Minh

      - name: Commit updated digest
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add news_for_ai_clean.json gemini_digest_summary.json content.json
          git commit -m "Update daily news digest (crawl + Gemini + web)" || echo "No content changes to commit"
          git push
