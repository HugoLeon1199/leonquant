name: Daily Macro Brief

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Leon Web Intel (Scrapy) dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leon_web_intel/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache Intel DuckDB (skip re-profile when config unchanged)
        uses: actions/cache@v4
        id: cache-intel-db
        with:
          path: data/web_intel_leonquant.duckdb
          key: intel-db-${{ hashFiles('config/sources_seed.txt', 'leon_web_intel/config/crawl_rules.yaml', 'config/tiers/*.txt') }}

      - name: Verify pipeline scripts compile
        run: |
          python -m py_compile macro_relevance.py finalize_summary_gpt.py build_website_content.py validate_content.py fetch_market_snapshot.py summarize_news_gemini.py scripts/run_intel_full_daily.py scripts/export_intel_to_news_output.py scripts/crawl_error_snapshot.py scripts/crawl_baseline_snapshot.py scripts/source_coverage_report.py scripts/investigate_zero_article_sources.py leon_web_intel/run_profile.py leon_web_intel/run_scrapy.py

      - name: Crawl macro news (Leon Web Intel → news_output.json)
        run: |
          EXTRA=""
          if [ "${{ steps.cache-intel-db.outputs.cache-hit }}" = "true" ]; then
            EXTRA="--skip-profile"
          fi
          python scripts/run_intel_full_daily.py --date today --timezone Asia/Ho_Chi_Minh $EXTRA

      - name: Fetch market snapshot (best-effort quotes)
        run: |
          python fetch_market_snapshot.py

      - name: Summarize source articles with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          python summarize_news_gemini.py --max-articles 40

      - name: Final editorial pass with GPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          python finalize_summary_gpt.py --skip-web-verify

      - name: Build public website content
        run: |
          python build_website_content.py --metadata-timeout 14

      - name: Validate JSON artifacts
        run: |
          python -m json.tool market_snapshot.json > /dev/null
          python -m json.tool final_summary.json > /dev/null
          python -m json.tool content.json > /dev/null
          python validate_content.py

      - name: Commit updated brief
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add news_output.json news_output_today.json news_output_all.json enriched_news.json gemini_summary.json market_snapshot.json final_summary.json content.json feed-config.json
          git commit -m "Update daily macro brief" || echo "No content changes to commit"
          git push
