name: LIVE pulse hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDELT pulse dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gdelt.txt

      - name: Write GCP service account
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          if [ -z "$GCP_SA_JSON" ]; then
            echo "Missing repository secret GCP_SA_JSON"
            exit 1
          fi
          printf '%s' "$GCP_SA_JSON" > credentials.json

      - name: Run leon.py (GDELT + Gemini)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python leon.py

      - name: Commit market_pulse.json
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add market_pulse.json web/market_pulse.json
          if git diff --staged --quiet; then
            echo "No pulse changes"
            exit 0
          fi
          git commit -m "Update LIVE pulse (hourly GDELT)."
          git push
