name: LIVE pulse 6h

on:
  schedule:
    # Mỗi 6 giờ đúng phút :00 UTC (00:00, 06:00, 12:00, 18:00 UTC ≈ 07:00, 13:00, 19:00, 01:00 VN).
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .ci-run-pulse
      - leon.py
      - sql/gdelt_invest_pulse.sql

permissions:
  contents: write

concurrency:
  group: live-pulse-6h
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-gdelt.txt

      - name: Install GDELT pulse dependencies
        run: pip install -r requirements-gdelt.txt

      - name: Write GCP service account
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          if [ -z "$GCP_SA_JSON" ]; then
            echo "Missing repository secret GCP_SA_JSON"
            exit 1
          fi
          printf '%s' "$GCP_SA_JSON" > credentials.json

      - name: Run leon.py — Tin thế giới LIVE
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python leon.py --channel world

      - name: Commit pulse JSON
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add market_pulse.json web/market_pulse.json
          if git diff --staged --quiet; then
            echo "No pulse changes"
            exit 0
          fi
          git commit -m "Update world LIVE pulse (GDELT 6h)."
          git pull --rebase origin main
          git push
