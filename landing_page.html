<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEON Quant Labs — Tổng hợp tin tức 48 giờ</title>
  <meta name="description" content="Tổng hợp tin tức thế giới và Việt Nam trong 48 giờ qua — theo lĩnh vực, kèm liên kết nguồn.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --bg0: #fafbfc;
      --bg1: #f4f6f9;
      --bg2: #eef1f6;
      --surface: #ffffff;
      --glass: #ffffff;
      --border: rgba(15, 23, 42, .1);
      --text: #0f172a;
      --text-soft: #334155;
      --muted: #475569;
      --faint: #64748b;
      --cyan: #0891b2;
      --cyan-dim: #0e7490;
      --cyan-link: #0369a1;
      --gold: #b45309;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .04);
      --shadow-md: 0 4px 20px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: var(--font-sans);
      color: var(--text);
      line-height: 1.52;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background:
        radial-gradient(ellipse 120% 80% at 10% -10%, rgba(8, 145, 178, .07), transparent 50%),
        radial-gradient(ellipse 90% 60% at 90% 10%, rgba(180, 83, 9, .05), transparent 45%),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 45%, var(--bg2) 100%);
      min-height: 100vh;
    }
    a { color: var(--cyan-link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { width: min(1020px, 92%); margin: 0 auto; }

    .hero {
      padding: 28px 0 48px;
      border-bottom: 1px solid var(--border);
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -.03em;
      font-size: 1.02rem;
    }
    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      display: grid;
      place-items: center;
      font-size: .72rem;
      font-weight: 900;
      color: #fff;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-left: auto;
      justify-content: flex-end;
      font-size: .84rem;
      font-weight: 600;
    }
    .nav-links a:not(.nav-hub) { color: var(--muted); }
    .nav-links a:not(.nav-hub):hover { color: var(--text); }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(1.85rem, 4.5vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }
    .hero-sub {
      font-size: 1.08rem;
      color: var(--muted);
      margin: 0 0 12px;
      font-weight: 650;
    }
    .hero-desc { margin: 0 0 16px; max-width: 58ch; color: var(--faint); }
    .hero-qs {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: .95rem;
    }
    .hero-qs li::before { content: "— "; color: var(--gold); }

    section { padding: 44px 0; }
    section.alt {
      background: var(--bg1);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(1.2rem, 2.8vw, 1.55rem);
      letter-spacing: -.03em;
    }
    .section-head p { margin: 8px 0 0; max-width: 68ch; color: var(--muted); font-size: .94rem; }
    .section-head { margin-bottom: 18px; }

    .thesis-block {
      border-radius: 18px;
      padding: 22px 24px;
      background: linear-gradient(145deg, rgba(8, 145, 178, .06), rgba(255, 255, 255, .95));
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .thesis-block p { margin: 0 0 12px; color: var(--text-soft); }
    .thesis-block p:last-child { margin-bottom: 0; }
    .lbl { font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }

    .cards {
      display: grid;
      gap: 14px;
    }
    @media (min-width: 860px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
    }
    .card {
      border-radius: 14px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .card h3 { margin: 0 0 10px; font-size: 1rem; }
    .card .sub { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-top: 10px; }
    .card .body { margin: 0; font-size: .9rem; color: var(--muted); }

    .chain-list { margin: 12px 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .9rem; }

    .data-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); margin-top: 12px; }
    table.data {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
    }
    table.data th, table.data td {
      padding: 11px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    table.data th {
      background: #f1f5f9;
      font-weight: 800;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--faint);
      white-space: nowrap;
    }
    table.data tr:last-child td { border-bottom: none; }
    table.data td { color: var(--muted); }

    .scenario-grid {
      display: grid;
      gap: 14px;
    }
    @media (min-width: 860px) {
      .scenario-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .sc {
      border-radius: 14px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      border-top: 3px solid var(--cyan);
    }
    .sc.bull { border-top-color: #4ade80; }
    .sc.bear { border-top-color: #fb7185; }
    .sc h3 { margin: 0 0 8px; font-size: .98rem; }
    .sc p { margin: 0; font-size: .88rem; color: var(--muted); }

    .takeaway {
      border-radius: 16px;
      padding: 20px;
      background: rgba(251, 191, 36, .07);
      border: 1px solid rgba(251, 191, 36, .25);
    }
    .takeaway p { margin: 0; color: var(--text-soft); font-size: .98rem; }

    .secondary-head h2 { font-size: 1.1rem; color: var(--faint); }

    .brief-block { margin-bottom: 32px; }
    .brief-block:last-of-type { margin-bottom: 8px; }

    .subhead { font-size: 0.9rem; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
    .compact-regime p { margin: 0 0 8px; font-size: 0.9rem; }
    .two-col-triggers { display: grid; gap: 16px; }
    @media (min-width: 720px) {
      .two-col-triggers { grid-template-columns: 1fr 1fr; }
    }

    section.reference-secondary {
      opacity: 0.92;
      padding-top: 36px;
      padding-bottom: 48px;
    }
    section.reference-secondary .section-head h2 {
      font-size: 1.02rem;
    }

    .source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
      gap: 16px;
    }
    .source-card {
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .source-card a { color: inherit; text-decoration: none !important; display: block; }
    .source-image {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      background: var(--bg2);
    }
    .fallback-image {
      display: grid;
      place-items: center;
      height: 120px;
      background: linear-gradient(135deg, #e2e8f0, #f1f5f9);
      color: var(--cyan-dim);
      font-weight: 800;
      font-size: .7rem;
      letter-spacing: .12em;
    }
    .source-body { padding: 14px; }
    .source-meta { font-size: .75rem; color: var(--faint); margin-bottom: 6px; }
    .source-body h3 { margin: 0 0 6px; font-size: .95rem; }
    .source-body p { margin: 0; font-size: .85rem; color: var(--muted); line-height: 1.45; }
    .read-pill { display: inline-block; margin-top: 10px; font-size: .8rem; font-weight: 800; color: var(--cyan-link); }

    .sync-note { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
    .error-card {
      padding: 20px;
      border-radius: 14px;
      background: rgba(251, 113, 133, .08);
      border: 1px solid rgba(251, 113, 133, .28);
      color: var(--muted);
    }
    .footer {
      padding: 24px 0;
      border-top: 1px solid var(--border);
      color: var(--faint);
      font-size: .85rem;
    }

    /* —— Digest mode (bản tin đa ngành) —— */
    .digest-toc {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
      padding: 0;
      list-style: none;
    }
    .digest-toc a {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 700;
      background: rgba(8, 145, 178, .08);
      border: 1px solid rgba(8, 145, 178, .2);
      color: var(--cyan-dim);
      text-decoration: none !important;
    }
    .digest-toc a:hover { background: rgba(8, 145, 178, .14); }

    .link-index-panel {
      border-radius: 16px;
      padding: 18px 20px;
      background: rgba(8, 145, 178, .05);
      border: 1px solid rgba(8, 145, 178, .15);
      box-shadow: var(--shadow-sm);
      margin-bottom: 8px;
    }
    .link-index-panel .hint {
      margin: 0 0 14px;
      font-size: .88rem;
      color: var(--muted);
    }
    .link-group { margin-bottom: 16px; }
    .link-group:last-child { margin-bottom: 0; }
    .link-group h3 {
      margin: 0 0 8px;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .link-rows { margin: 0; padding: 0; list-style: none; }
    .link-rows li {
      margin: 0 0 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: .86rem;
      line-height: 1.4;
    }
    .link-rows a {
      font-weight: 650;
      word-break: break-word;
    }
    .link-rows .link-meta {
      display: block;
      margin-top: 3px;
      font-size: .74rem;
      color: var(--faint);
      font-weight: 600;
    }

    .sectors-section-title {
      margin: 0 0 14px;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .sector-block {
      border-radius: 16px;
      padding: 0;
      margin-bottom: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      scroll-margin-top: 72px;
      overflow: hidden;
    }
    .sector-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 145, 178, .06);
    }
    .sector-num {
      flex-shrink: 0;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: .78rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    }
    .sector-head h3 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -.02em;
      line-height: 1.35;
    }
    .sector-mini-toc {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 20px 14px;
      margin: 0;
      list-style: none;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 145, 178, .04);
    }
    .sector-mini-toc li { margin: 0; }
    .sector-mini-toc a {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: .74rem;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid transparent;
      text-decoration: none !important;
    }
    .sector-mini-toc a:hover {
      color: var(--cyan-dim);
      border-color: rgba(8, 145, 178, .25);
      background: rgba(8, 145, 178, .08);
    }
    .sector-body { padding: 16px 20px 20px; }
    .sector-part {
      scroll-margin-top: 88px;
      padding-top: 4px;
      margin-bottom: 18px;
    }
    .sector-part:last-child { margin-bottom: 0; }
    .sector-part-title {
      margin: 0 0 10px;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .sector-head-main { flex: 1; min-width: 0; }
    .sector-code {
      display: block;
      margin: 0 0 2px;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .sector-intro {
      margin: 0 0 14px;
      padding: 0 20px;
      font-size: .9rem;
      line-height: 1.68;
      color: var(--text-soft);
      text-align: left;
    }
    .sector-topic-list {
      margin: 0;
      padding: 0 16px 18px 20px;
      list-style: none;
    }
    .sector-topic-row {
      margin: 0 0 10px;
      padding: 0;
    }
    .sector-topic-row:last-child { margin-bottom: 0; }
    .sector-topic-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .sector-topic-num {
      flex-shrink: 0;
      width: 1.5rem;
      font-size: .72rem;
      font-weight: 800;
      color: var(--faint);
      line-height: 1.45;
    }
    .sector-topic-main { flex: 1; min-width: 0; }
    .sector-topic-headline {
      margin: 0 0 6px;
      color: var(--text-soft);
      font-size: .9rem;
      line-height: 1.55;
    }
    .sector-topic-source {
      display: inline-block;
      font-size: .78rem;
      font-weight: 700;
      color: var(--cyan-link);
      text-decoration: none !important;
    }
    .sector-topic-source:hover {
      text-decoration: underline !important;
      color: var(--cyan-dim);
    }

    .overview-part { scroll-margin-top: 88px; margin-bottom: 20px; }
    .overview-part:last-child { margin-bottom: 0; }
    ul.prose-bullets { margin: 0.35em 0 0; padding-left: 1.2rem; }
    ul.prose-bullets li { margin-bottom: 0.5em; line-height: 1.58; }
    ul.prose-bullets li:last-child { margin-bottom: 0; }

    .digest-main-panel {
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 8px;
      background: linear-gradient(145deg, rgba(8, 145, 178, .05), var(--surface));
      border: 1px solid rgba(8, 145, 178, .14);
      box-shadow: var(--shadow-md);
    }
    .digest-main-exec {
      margin-bottom: 22px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .digest-main-sectors .sector-block:first-of-type {
      margin-top: 4px;
    }

    .prose-block p {
      margin: 0 0 12px;
      color: var(--text-soft);
      font-size: .94rem;
      line-height: 1.65;
    }
    .prose-block p:last-child { margin-bottom: 0; }

    .article-index-wrap {
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg1);
      overflow: hidden;
    }
    .article-index-wrap summary {
      cursor: pointer;
      padding: 14px 18px;
      font-weight: 750;
      font-size: .92rem;
      color: var(--text);
      list-style: none;
    }
    .article-index-wrap summary::-webkit-details-marker { display: none; }
    .article-index-scroll {
      max-height: 420px;
      overflow-y: auto;
      padding: 0 14px 14px;
      border-top: 1px solid var(--border);
    }
    .article-link-rows li { font-size: .82rem; }

    .notable-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0 0 18px;
    }
    .notable-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      text-decoration: none !important;
      color: inherit;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .notable-item:hover {
      border-color: rgba(8, 145, 178, .32);
      box-shadow: var(--shadow-md);
      background: #fafcfd;
    }
    .notable-item-rank {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: .72rem;
      font-weight: 800;
      color: var(--cyan-dim);
      background: rgba(8, 145, 178, .08);
      border: 1px solid rgba(8, 145, 178, .15);
    }
    .notable-item-thumb {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg2);
      border: 1px solid var(--border);
    }
    .notable-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .notable-item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .notable-item-title {
      display: block;
      margin: 0;
      font-size: .92rem;
      font-weight: 750;
      line-height: 1.4;
      color: var(--text);
    }
    .notable-item-meta {
      display: block;
      margin: 0;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--cyan-dim);
    }
    .article-archive-wrap { margin-top: 8px; }
    .article-archive-wrap summary {
      cursor: pointer;
      padding: 16px 20px;
      font-weight: 750;
      font-size: .95rem;
      list-style: none;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg1);
    }
    .article-archive-wrap summary::-webkit-details-marker { display: none; }
    .article-archive-wrap[open] summary {
      border-radius: 14px 14px 0 0;
      border-bottom: 1px solid var(--border);
    }
    .article-archive-scroll {
      max-height: min(70vh, 560px);
      overflow-y: auto;
      padding: 12px 16px 16px;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 14px 14px;
      background: var(--surface);
    }

    body.digest-mode .source-grid { display: none; }
    body.digest-mode .hero-qs { display: none; }
    body.digest-mode .hero h1,
    body.digest-mode .hero-sub,
    body.digest-mode .hero-desc { display: none; }
    body.digest-mode .hero { padding: 22px 0 28px; }
    .nav-hub {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 750;
      letter-spacing: .02em;
      color: var(--cyan-dim);
      border: 1px solid rgba(8, 145, 178, .28);
      background: rgba(8, 145, 178, .08);
      text-decoration: none !important;
    }
    .nav-hub:hover {
      border-color: var(--cyan);
      background: rgba(8, 145, 178, .14);
      color: var(--cyan-dim);
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }
    .nav-hub--active {
      color: #fff;
      background: linear-gradient(135deg, var(--cyan), #22d3ee);
      border-color: transparent;
    }
    .nav-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 2px;
    }
    .nav-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55);
      animation: nav-live-pulse 1.4s ease-out infinite;
    }
    @keyframes nav-live-pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
      70% { box-shadow: 0 0 0 7px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    body.digest-mode .logo {
      font-size: clamp(1.55rem, 4vw, 2.35rem);
      gap: 16px;
      letter-spacing: -.04em;
    }
    body.digest-mode .logo-mark {
      width: 56px;
      height: 56px;

  <!-- Rocket Loader (Cloudflare) có thể làm lệch script inline; tắt cho block này -->
  <script data-cfasync="false">
    const ND = "—";

    /** Gốc site để fetch content.json / feed-config đúng dù trang mở tại /landing_page/ hay /repo/landing_page/ */
    function siteBaseUrl() {
      if (window.location.protocol === "file:") {
        return new URL(".", window.location.href).href;
      }
      const host = window.location.hostname.replace(/^www\./, "").toLowerCase();
      if (host === "leonquant.com") {
        return `${window.location.origin}/`;
      }
      let path = window.location.pathname.replace(/\/$/, "");
      for (const suf of ["/index.html", "/landing_page.html", "/landing_page"]) {
        if (path.endsWith(suf)) {
          path = path.slice(0, -suf.length);
          break;
        }
      }
      if (path.endsWith(".html")) {
        path = path.slice(0, path.lastIndexOf("/"));
      }
      const dir = path === "" ? "/" : path + "/";
      return new URL(dir, window.location.origin).href;
    }

    function assetUrl(filename) {
      const name = String(filename).replace(/^\//, "");
      return new URL(name, siteBaseUrl()).href;
    }

    /** JSON từ mạng đôi khi có BOM (UTF-8) — JSON.parse sẽ lỗi nếu không bỏ. */
    async function readJsonResponse(response) {
      const text = await response.text();
      return JSON.parse(String(text).replace(/^\uFEFF/, "").trim());
    }

    function normalizeContentPayload(raw) {
      if (!raw || typeof raw !== "object") return raw;
      if (raw.briefMode === "multisector-digest") return raw;
      if (Array.isArray(raw.digestSectors) && raw.digestSectors.length) {
        return { ...raw, briefMode: "multisector-digest" };
      }
      return raw;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateVi(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString("vi-VN", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    function getHostName(u) {
      try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; }
    }

    const SOURCE_DISPLAY_BY_HOST = {
      "dantri.com.vn": "Dân trí",
      "vnexpress.net": "VnExpress",
      "tuoitre.vn": "Tuổi Trẻ",
      "thanhnien.vn": "Thanh Niên",
      "vietnamnet.vn": "VietnamNet",
      "baochinhphu.vn": "Báo Chính phủ",
      "cafef.vn": "CafeF",
      "vneconomy.vn": "VnEconomy",
      "genk.vn": "GenK",
      "plo.vn": "PLO",
      "laodong.vn": "Lao động",
      "tienphong.vn": "Tiền Phong",
      "aljazeera.com": "Al Jazeera",
      "reuters.com": "Reuters",
      "bloomberg.com": "Bloomberg",
      "cnbc.com": "CNBC",
      "techcrunch.com": "TechCrunch",
      "theverge.com": "The Verge",
    };

    function formatSourceLinkLabel(link, url) {
      const lk = link || {};
      const preset = String(lk.label || "").trim();
      if (preset) return preset;
      const u = String(url || lk.url || "").trim();
      const host = String(lk.host || "").trim() || getHostName(u);
      let source = String(lk.source || "").trim();
      if (source && host && source.toLowerCase() === host.toLowerCase()) source = "";
      const brand = source || SOURCE_DISPLAY_BY_HOST[host.toLowerCase()] || "";
      if (brand && host && brand.toLowerCase() !== host.toLowerCase()) return `${brand} · ${host}`;
      return host || brand || u || "Nguồn";
    }

    function applyHeroBranding(data) {
      const digestMode = data.briefMode === "multisector-digest";
      const pub = data.publicationIntro || {};
      const heroSub = document.getElementById("heroSubtitle");
      const heroDesc = document.getElementById("heroDescription");
      if (heroSub) {
        if (digestMode) {
          heroSub.textContent = "";
          heroSub.style.display = "none";
        } else {
          heroSub.style.display = "";
          heroSub.textContent =
            (data.sectionLabel && String(data.sectionLabel).trim()) ||
            pub.headline ||
            heroSub.textContent;
        }
      }
      if (heroDesc) {
        if (digestMode) {
          heroDesc.textContent = "";
          heroDesc.style.display = "none";
        } else {
          const short =
            String(pub.description || "").trim().slice(0, 220) ||
            "Tóm tắt đầy đủ và liên kết nguồn nằm ngay bên dưới.";
          heroDesc.textContent = short + (String(pub.description || "").length > 220 ? "…" : "");
        }
      }
    }

    function proseToBullets(text) {
      const raw = String(text || "").trim();
      if (!raw) return [];
      if (/^\s*[-•*]\s/m.test(raw)) {
        return raw
          .split(/\n+/)
          .map((ln) => ln.replace(/^\s*[-•*]\s+/, "").trim())
          .filter(Boolean);
      }
      const out = [];
      const paras = raw.includes("\n\n") ? raw.split(/\n\s*\n/) : [raw];
      for (const para of paras) {
        const p = para.replace(/\s+/g, " ").trim();
        if (!p) continue;
        const chunks = p.split(/(?<=[.!?…])\s+(?=["'“‘(A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƠƯ0-9])/);
        const parts = chunks.length > 1 ? chunks : p.split(/(?<=[;])\s+/);
        for (const c of parts) {
          const t = c.trim();
          if (t.length >= 18) out.push(t);
        }
      }
      return out.length ? out : [raw];
    }

    function getDigestBullets(data, arrayKey, fallbackText) {
      const arr = data[arrayKey];
      if (Array.isArray(arr) && arr.length) {
        return arr.map((s) => String(s || "").trim()).filter(Boolean);
      }
      return proseToBullets(fallbackText);
    }

    function buildProseBulletsHtml(items) {
      if (!items.length) return `<p>${escapeHtml(ND)}</p>`;
      let h = `<ul class="sector-points prose-bullets">`;
      for (const it of items) h += `<li>${escapeHtml(it)}</li>`;
      h += `</ul>`;
      return h;
    }

    function mergeOverviewBullets(exec, intl, vn) {
      const seen = new Set();
      const out = [];
      for (const list of [exec, intl, vn]) {
        for (const b of list) {
          const t = String(b || "").trim();
          if (!t) continue;
          const key = t.toLowerCase().slice(0, 80);
          if (seen.has(key)) continue;
          seen.add(key);
          out.push(t);
        }
      }
      return out;
    }

    function sectorSlug(name) {
      return (
        "sector-" +
        String(name || "linh-vuc")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "")
      );
    }

    const DIGEST_MAX_SECTOR_ITEMS = 20;

    const DIGEST_FOUR_SECTORS = [
      { code: "finance", name: "Kinh tế & Tài chính" },
      { code: "tech", name: "Công nghệ & AI" },
      { code: "news", name: "Thời sự & Chính trị" },
      { code: "trends", name: "Xu hướng & Đời sống" },
    ];

    function inferDigestSectorCode(name) {
      const n = String(name || "").toLowerCase();
      if (/công nghệ|cong nghe|\bai\b|khoa học|bán dẫn|viễn thông|tech|chip/.test(n)) return "tech";
      if (/chính trị|thời sự|ngoại giao|địa chính|quốc tế|iran|israel|ukraine/.test(n)) return "news";
      if (/xu hướng|đời sống|quan điểm|góc nhìn|xã hội|pháp luật|y tế|môi trường|thể thao|văn hóa/.test(n)) return "trends";
      if (/kinh tế|tài chính|chứng khoán|bất động|tiền ảo|crypto|ngân hàng|thị trường/.test(n)) return "finance";
      return "trends";
    }

    function normalizeSectorItems(s) {
      if (Array.isArray(s.items) && s.items.length) {
        return s.items
          .filter((it) => it && String(it.headline || "").trim())
          .map((it) => ({
            headline: String(it.headline || "").trim(),
            links: (Array.isArray(it.links) ? it.links : []).filter(
              (lk) => lk && String(lk.url || "").trim(),
            ),
          }));
      }
      const pts = Array.isArray(s.keyPoints) ? s.keyPoints : [];
      const links = Array.isArray(s.links) ? s.links : [];
      return pts
        .map((p) => String(p || "").trim())
        .filter(Boolean)
        .map((headline, i) => ({
          headline,
          links: links.slice(i, i + 1),
        }));
    }

    function ensureDigestSectors(data) {
      const raw = Array.isArray(data.digestSectors) && data.digestSectors.length
        ? data.digestSectors.filter((s) => s && typeof s === "object")
        : (Array.isArray(data.globalMacroDrivers) ? data.globalMacroDrivers : []).map((d) => ({
            name: d.title || "Lĩnh vực",
            summary: d.analysis || "",
            keyPoints: String(d.marketImpact || "")
              .split("\n")
              .map((x) => x.replace(/^•\s*/, "").trim())
              .filter(Boolean),
            links: [],
          }));
      const buckets = Object.fromEntries(
        DIGEST_FOUR_SECTORS.map(({ code, name }) => [
          code,
          { code, name, summary: "", items: [] },
        ]),
      );
      for (const s of raw) {
        const code =
          String(s.code || "").trim().toLowerCase() ||
          inferDigestSectorCode(s.name);
        const bucket = buckets[code] || buckets.trends;
        bucket.name = String(s.name || "").trim() || bucket.name;
        if (String(s.summary || "").trim()) {
          const next = String(s.summary).trim();
          bucket.summary = bucket.summary
            ? `${bucket.summary} ${next}`.trim().slice(0, 2800)
            : next;
        }
        bucket.items.push(...normalizeSectorItems(s));
      }
      const seen = new Set();
      return DIGEST_FOUR_SECTORS.map(({ code, name }) => {
        const b = buckets[code];
        const items = [];
        for (const it of b.items) {
          const key = it.headline.toLowerCase().slice(0, 120);
          if (seen.has(key)) continue;
          seen.add(key);
          items.push(it);
        }
        items.sort(
          (a, b) =>
            (Number(a.importanceRank) || 999) - (Number(b.importanceRank) || 999),
        );
        return {
          code,
          name: b.name || name,
          summary: b.summary,
          items: items.slice(0, DIGEST_MAX_SECTOR_ITEMS),
        };
      });
    }

    function buildLinkRowsHtml(links) {
      if (!links.length) return `<p class="hint">Chưa có liên kết nguồn.</p>`;
      let h = `<ul class="link-rows">`;
      for (const L of links) {
        const u = String(L.url || "").trim();
        if (!u) continue;
        const title = escapeHtml(L.title || L.host || u);
        const meta = [L.source, L.host].filter(Boolean).join(" · ");
        h += `<li><a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${title}</a>`;
        if (meta) h += `<span class="link-meta">${escapeHtml(meta)}</span>`;
        h += `</li>`;
      }
      h += `</ul>`;
      return h;
    }

    function buildDigestLinkIndexHtml(data) {
      const index = Array.isArray(data.digestLinkIndex) ? data.digestLinkIndex : [];
      const groups = new Map();
      for (const row of index) {
        if (!row || typeof row !== "object") continue;
        const g = String(row.group || row.sector || "Khác").trim() || "Khác";
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(row);
      }
      let html = `<div class="section-head"><p class="eyebrow">Liên kết</p><h2>Chỉ mục nguồn & bài đọc</h2></div>`;
      html += `<div class="link-index-panel"><p class="hint">Liên kết trỏ tới bài báo gốc — nhấn để mở tab mới và đối chiếu. Nhóm theo lĩnh vực.</p>`;
      for (const [group, rows] of groups) {
        html += `<div class="link-group"><h3>${escapeHtml(group)} (${rows.length})</h3>`;
        html += buildLinkRowsHtml(rows);
        html += `</div>`;
      }
      html += `</div>`;
      return html;
    }

    function buildArticleImageLookup(data) {
      const map = new Map();
      const add = (url, img) => {
        const u = String(url || "").trim();
        const i = String(img || "").trim();
        if (u && i && !map.has(u)) map.set(u, i);
      };
      for (const a of Array.isArray(data.allArticles) ? data.allArticles : []) {
        add(a.url, a.image_url || a.imageUrl);
      }
      for (const a of Array.isArray(data.articleLinkIndex) ? data.articleLinkIndex : []) {
        add(a.url, a.image_url || a.imageUrl);
      }
      return map;
    }

    function buildNotableCardsHtml(notable, imageByUrl) {
      const items = (Array.isArray(notable) ? notable : [])
        .filter((a) => a && String(a.url || "").trim())
        .slice(0, 9);
      if (!items.length) {
        return `<p class="hint">Chưa có tin nổi bật trong bản digest hôm nay.</p>`;
      }
      let h = `<div class="notable-list">`;
      items.forEach((a, idx) => {
        const u = String(a.url || "").trim();
        const title = escapeHtml(a.title || u);
        const meta = escapeHtml(
          [a.source, a.host || getHostName(u)].filter(Boolean).join(" · "),
        );
        const img = String(
          a.imageUrl || a.image_url || imageByUrl.get(u) || "",
        ).trim();
        const rank = String(idx + 1).padStart(2, "0");
        h += `<a class="notable-item" href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">`;
        h += `<span class="notable-item-rank">${rank}</span>`;
        if (img) {
          h += `<span class="notable-item-thumb"><img src="${escapeHtml(img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentElement.remove()"></span>`;
        }
        h += `<span class="notable-item-body">`;
        h += `<span class="notable-item-title">${title}</span>`;
        if (meta) h += `<span class="notable-item-meta">${meta}</span>`;
        h += `</span></a>`;
      });
      h += `</div>`;
      return h;
    }

    function buildSectorBlockHtml(s, index) {
      const code = String(s.code || "").trim();
      const name = String(s.name || "").trim() || "Lĩnh vực";
      const id = sectorSlug(code || name);
      const items = normalizeSectorItems(s);
      const intro = String(s.summary || "").trim();

      let h = `<article class="sector-block" id="${id}">`;
      h += `<header class="sector-head"><span class="sector-num">${String(index + 1).padStart(2, "0")}</span>`;
      h += `<div class="sector-head-main">`;
      if (code) h += `<span class="sector-code">${escapeHtml(code)}</span>`;
      h += `<h3>${escapeHtml(name)}</h3></div></header>`;
      h += `<div class="sector-body">`;
      if (intro) h += `<p class="sector-intro">${escapeHtml(intro)}</p>`;
      if (items.length) {
        h += `<ol class="sector-topic-list">`;
        items.forEach((it, ti) => {
          const lk = (it.links || [])[0];
          const u = lk ? String(lk.url || "").trim() : "";
          h += `<li class="sector-topic-row">`;
          h += `<span class="sector-topic-num">${String(ti + 1).padStart(2, "0")}</span>`;
          h += `<div class="sector-topic-main">`;
          h += `<p class="sector-topic-headline">${escapeHtml(it.headline)}</p>`;
          if (u) {
            const srcLabel = escapeHtml(formatSourceLinkLabel(lk, u));
            h += `<a class="sector-topic-source" href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${srcLabel}</a>`;
          }
          h += `</div></li>`;
        });
        h += `</ol>`;
      } else {
        h += `<p class="hint">Chưa có tin chi tiết trong nhóm này.</p>`;
      }
      h += `</div></article>`;
      return h;
    }

    function buildDigestBriefParts(data) {
      const mt = data.mainThesis || {};
      const sectors = ensureDigestSectors(data);
      const vn = String(data.digestVietnamHighlights || "").trim();
      const intl = String(data.digestInternationalHighlights || "").trim();
      const gaps = String(data.digestGapsAndLimits || "").trim();
      const notable = Array.isArray(data.digestNotableArticles)
        ? data.digestNotableArticles.slice(0, 9)
        : [];
      const imageByUrl = buildArticleImageLookup(data);
      const execBullets = getDigestBullets(data, "digestExecutiveBullets", mt.thesis || "");
      const intlBullets = getDigestBullets(
        data,
        "digestInternationalBullets",
        intl,
      );
      const vnBullets = getDigestBullets(data, "digestVietnamBullets", vn);
      const overviewBullets = mergeOverviewBullets(execBullets, intlBullets, vnBullets);
      const articles = Array.isArray(data.articleLinkIndex) ? data.articleLinkIndex : [];

      const reportTitle =
        String(data.digestReportTitle || "").trim() ||
        "Tổng hợp tin tức toàn cầu và Việt Nam (48 giờ)";

      let thesisHtml = `<article id="digest-report" class="digest-report">`;
      thesisHtml += `<header class="digest-report-head">`;
      thesisHtml += `<h2>${escapeHtml(reportTitle)}</h2>`;
      thesisHtml += `</header>`;
      thesisHtml += `<div class="digest-main-panel">`;
      if (overviewBullets.length) {
        thesisHtml += `<section class="overview-part" id="digest-main--overview">`;
        thesisHtml += `<h3 class="sectors-section-title">Tổng quan</h3>`;
        thesisHtml += buildProseBulletsHtml(overviewBullets);
        thesisHtml += `</section>`;
      }
      thesisHtml += `<section class="digest-main-sectors overview-part" id="digest-main--sectors">`;
      thesisHtml += `<h3 class="sectors-section-title">Chi tiết theo lĩnh vực</h3>`;
      if (!sectors.length) {
        thesisHtml += `<p class="error-card">Chưa có lĩnh vực trong digest.</p>`;
      } else {
        for (let i = 0; i < sectors.length; i++) {
          thesisHtml += buildSectorBlockHtml(sectors[i], i);
        }
      }
      thesisHtml += `</section>`;
      if (notable.length || articles.length) {
        thesisHtml += `<section class="overview-part digest-report-extra" id="digest-main--notable">`;
        thesisHtml += `<h3 class="sectors-section-title">Tin đáng chú ý</h3>`;
        thesisHtml += buildNotableCardsHtml(notable, imageByUrl);
        if (articles.length) {
          thesisHtml += `<details class="article-archive-wrap digest-notable-all">`;
          thesisHtml += `<summary>Bấm vào xem chi tiết · ${articles.length} bài</summary>`;
          thesisHtml += `<div class="article-archive-scroll">`;
          thesisHtml += buildLinkRowsHtml(
            articles.map((a) => ({
              url: a.url,
              title: a.title,
              source: [a.source, formatDateVi(a.publishedAt)].filter(Boolean).join(" · "),
              host: a.host || getHostName(a.url || ""),
            })),
          );
          thesisHtml += `</div></details>`;
        }
        thesisHtml += `</section>`;
      }
      if (gaps) {
        thesisHtml += `<section class="overview-part digest-report-extra" id="digest-main--gaps">`;
        thesisHtml += `<h3 class="sectors-section-title">Ghi chú</h3><p class="hint">${escapeHtml(gaps)}</p></section>`;
      }
      thesisHtml += `</div></article>`;

      return {
        linkIndex: "",
        thesis: thesisHtml,
        whatChanged: "",
        digestHighlights: "",
        regime: "",
        macro: "",
        intermarket: "",
        transmission: "",
        actions: "",
        allocation: "",
        priority: "",
        riskOn: "",
        riskOff: "",
        intraday: "",
        scenarios: "",
        triggers: "",
        finalDecision: "",
        articleIndex: "",
      };
    }

    const PULSE_DOMAIN_LABELS = {
      finance: "Kinh tế & Tài chính",
      politics: "Thời sự & Chính trị",
      conflict: "Xung đột & An ninh",
      tech: "Công nghệ & AI",
      science: "Khoa học",
      health: "Y tế",
      climate: "Khí hậu & Môi trường",
      crypto: "Tiền số",
      all: "Toàn cầu",
    };

    const LIVE_VIEW_ALIASES = new Set(["pulse", "live", "minute"]);

    function currentView() {
      const q = new URLSearchParams(window.location.search);
      const v = (q.get("view") || "").toLowerCase();
      if (LIVE_VIEW_ALIASES.has(v)) return "pulse";
      const h = (window.location.hash || "").replace(/^#/, "").toLowerCase();
      if (LIVE_VIEW_ALIASES.has(h)) return "pulse";
      return "digest";
    }

    function digestNavHref() {
      const path = (window.location.pathname || "/").replace(/\/+$/, "") || "/";
      if (path === "/" || path === "" || /\/index\.html$/i.test(path) || /\/landing_page\.html$/i.test(path)) {
        return path.endsWith(".html") ? path : "/";
      }
      return "/";
    }

    function liveNavHref() {
      const base = digestNavHref();
      const sep = base.includes("?") ? "&" : "?";
      if (base.endsWith(".html")) return base + sep + "view=live";
      return base === "/" ? "/?view=live" : base + "?view=live";
    }

    function updateSiteNav(view) {
      const nav = document.getElementById("navLinks");
      if (!nav) return;
      const v = view || currentView();
      const dClass = v === "digest" ? "nav-hub nav-hub--active" : "nav-hub";
      const pClass = v === "pulse" ? "nav-hub nav-hub--active" : "nav-hub";
      nav.innerHTML = `
        <a class="${dClass}" href="${escapeHtml(digestNavHref())}" data-view="digest">Tin tức tổng hợp 24h</a>
        <a class="${pClass}" href="${escapeHtml(liveNavHref())}" data-view="live">Tin tức thế giới <span class="nav-live-badge"><span class="nav-live-dot"></span>LIVE</span></a>`;
    }

    function applyViewMode(view) {
      const v = view || currentView();
      document.body.classList.toggle("digest-mode", v === "digest");
      document.body.classList.toggle("pulse-mode", v === "pulse");
      const pulseSec = document.getElementById("pulse");
      if (pulseSec) pulseSec.hidden = v !== "pulse";
      updateSiteNav(v);
    }

    let cachedDigestPayload = null;
    let cachedPulsePayload = null;

    function syncHistoryForView(view, replace) {
      const url = view === "pulse" ? liveNavHref() : digestNavHref();
      const state = { view };
      if (replace) history.replaceState(state, "", url);
      else history.pushState(state, "", url);
    }

    async function switchView(view, opts) {
      const options = opts || {};
      const v = LIVE_VIEW_ALIASES.has(String(view || "").toLowerCase()) || view === "pulse" ? "pulse" : "digest";
      applyViewMode(v);
      if (!options.skipHistory) syncHistoryForView(v, Boolean(options.replace));
      if (v === "pulse") {
        if (cachedPulsePayload && !options.forceReload) {
          renderPulsePage(cachedPulsePayload);
          return;
        }
        await loadPulseContent();
        return;
      }
      if (cachedDigestPayload && !options.forceReload) {
        renderPage(cachedDigestPayload);
        return;
      }
      await loadChatContent();
    }

    function bindNavTabs() {
      const nav = document.getElementById("navLinks");
      if (!nav || nav.dataset.navBound === "1") return;
      nav.dataset.navBound = "1";
      nav.addEventListener("click", (e) => {
        const a = e.target.closest("a[data-view]");
        if (!a) return;
        e.preventDefault();
        const dv = a.getAttribute("data-view");
        switchView(dv === "live" ? "pulse" : "digest");
      });
    }

    function pulseSentimentLabel(ev) {
      if (ev.sentiment_label) return String(ev.sentiment_label);
      const t = Number(ev.tone);
      if (Number.isNaN(t)) return "";
      if (t >= 2) return "Tích cực";
      if (t <= -2) return "Tiêu cực";
      return "Trung tính";
    }

    function pulseSentimentClass(label) {
      if (label === "Tích cực") return "pulse-sentiment--pos";
      if (label === "Tiêu cực") return "pulse-sentiment--neg";
      return "pulse-sentiment--neu";
    }

    function pulseCoverageCount(ev) {
      const n = ev.article_mentions ?? ev.articleMentions;
      if (n != null && !Number.isNaN(Number(n))) return Math.max(1, Math.round(Number(n)));
      return Math.max(1, (ev.urls || []).length);
    }

    function pulseSourceLabel(url) {
      const host = getHostName(url);
      const brand = SOURCE_DISPLAY_BY_HOST[host.toLowerCase()] || "";
      if (brand && host) return `${brand} · ${host}`;
      return host || url || "Nguồn";
    }

    function normalizePulseEvents(data) {
      const raw = Array.isArray(data?.events) ? data.events : [];
      return raw.map((ev) => {
        if (ev.sector != null || ev.title != null || ev.primary_actor != null) {
          const sector = String(ev.sector || "").trim();
          const headline = String(ev.title || "").trim();
          const entities = Array.isArray(ev.entities)
            ? ev.entities
            : Array.isArray(ev.related_entities)
              ? ev.related_entities
              : [];
          const actor = String(ev.primary_actor || "").trim();
          if (actor && !entities.some((e) => String(e).toUpperCase() === actor.toUpperCase())) {
            entities.unshift(actor);
          }
          return {
            title: headline || "(Title unavailable)",
            sector,
            impact: ev.impact_score,
            tone: ev.sentiment_tone,
            sentiment_label: ev.sentiment_label || "",
            article_mentions: ev.article_mentions,
            entities,
            hint: String(ev.summary || ev.summary_hint || "").trim(),
            urls: Array.isArray(ev.sources) ? ev.sources.filter(Boolean) : [],
          };
        }
        const domain = String(ev.domain || "all");
        return {
          title: String(ev.title || "Sự kiện"),
          sector: ev.domain_label || PULSE_DOMAIN_LABELS[domain] || domain,
          impact: ev.importance_score,
          tone: ev.tone,
          entities: (ev.organizations || []).slice(0, 3),
          urls: (Array.isArray(ev.urls) ? ev.urls : []).filter(Boolean),
          hint: ev.summary_hint || "",
        };
      });
    }

    function collectPulseFeedItems(data, events) {
      const raw = Array.isArray(data?.live_feed_items) ? data.live_feed_items : [];
      if (raw.length) {
        return raw.filter((x) => x && String(x.url || "").startsWith("http"));
      }
      const urls = collectPulseFeedUrls(data, events);
      return urls.map((u) => ({ url: u, sector: "", mentions: 0 }));
    }

    function eventScrollUrls(ev, data) {
      const own = (ev.urls || []).map((u) => String(u || "").trim()).filter((u) => u.startsWith("http"));
      const sector = String(ev.sector || "").trim();
      const feed = Array.isArray(data?.live_feed_items) ? data.live_feed_items : [];
      const fromSector = feed
        .filter((x) => String(x.sector || "").trim() === sector)
        .map((x) => String(x.url || "").trim())
        .filter((u) => u.startsWith("http"));
      const seen = new Set();
      const out = [];
      for (const u of [...own, ...fromSector]) {
        if (!seen.has(u)) {
          seen.add(u);
          out.push(u);
        }
      }
      return out.slice(0, 20);
    }

    function buildEventUrlTicker(urls) {
      let list = (Array.isArray(urls) ? urls : []).map((u) => String(u || "").trim()).filter((u) => u.startsWith("http"));
      if (!list.length) return "";
      const base = list.slice();
      while (list.length < 8) list = list.concat(base);
      const rows = list
        .map((u) => {
          const label = pulseSourceLabel(u);
          return `<li><a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a></li>`;
        })
        .join("");
      return `<div class="pulse-event-ticker">
        <div class="pulse-event-ticker-viewport">
          <div class="pulse-event-ticker-scroll">
            <ul class="pulse-event-ticker-list">${rows}</ul>
            <ul class="pulse-event-ticker-list" aria-hidden="true">${rows}</ul>
          </div>
        </div>
      </div>`;
    }

    function collectPulseFeedUrls(data, events) {
      const fromJson = Array.isArray(data?.live_feed_urls) ? data.live_feed_urls.filter(Boolean) : [];
      if (fromJson.length) return fromJson;
      const seen = new Set();
      const out = [];
      for (const ev of events) {
        for (const u of ev.urls || []) {
          const url = String(u || "").trim();
          if (url.startsWith("http") && !seen.has(url)) {
            seen.add(url);
            out.push(url);
          }
        }
      }
      return out;
    }

    function buildPulseHtml(data) {
      const events = normalizePulseEvents(data);
      if (!events.length) {
        return `<div class="pulse-panel"><p class="hint">Chưa có tin cập nhật. Chạy <code>python leon.py</code> (GCP BigQuery) rồi push <code>market_pulse.json</code>.</p></div>`;
      }
      let h = `<article class="digest-report"><header class="digest-report-head">`;
      h += `<h2>Tin nóng nhất thế giới hiện tại <span class="pulse-title-live"><span class="nav-live-dot"></span>LIVE</span></h2>`;
      h += `</header><div class="pulse-panel">`;
      h += `<ol class="pulse-event-list">`;
      events.forEach((ev) => {
        const sentiment = pulseSentimentLabel(ev);
        const sClass = pulseSentimentClass(sentiment);
        const coverage = pulseCoverageCount(ev);
        const urls = (ev.urls || []).map((u) => String(u || "").trim()).filter((u) => u.startsWith("http"));
        const scrollUrls = eventScrollUrls(ev, data);
        h += `<li class="pulse-event">`;
        if (ev.sector) {
          h += `<p class="pulse-event-sector">${escapeHtml(ev.sector)}</p>`;
        }
        h += `<h3 class="pulse-event-title">${escapeHtml(ev.title)}</h3>`;
        if (ev.hint) {
          h += `<p class="pulse-event-hint">${escapeHtml(ev.hint)}</p>`;
        }
        if (urls.length) {
          h += `<div class="pulse-event-links-row">`;
          urls.slice(0, 2).forEach((u) => {
            h += `<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(pulseSourceLabel(u))}</a>`;
          });
          h += `</div>`;
        }
        h += buildEventUrlTicker(scrollUrls.length ? scrollUrls : urls);
        h += `<p class="pulse-event-meta">`;
        h += `<strong>${escapeHtml(coverage)}</strong> báo đề cập`;
        if (sentiment) {
          h += ` · <span class="${sClass}">${escapeHtml(sentiment)}</span>`;
        }
        h += `</p>`;
        h += `</li>`;
      });
      h += `</ol></div></article>`;
      return h;
    }

    function renderPulsePage(data) {
      applyViewMode("pulse");
      const heroSub = document.getElementById("heroSubtitle");
      const heroDesc = document.getElementById("heroDescription");
      if (heroSub) {
        heroSub.style.display = "none";
        heroSub.textContent = "";
      }
      if (heroDesc) {
        heroDesc.style.display = "none";
        heroDesc.textContent = "";
      }
      const sync = document.getElementById("pulseSyncNote");
      if (sync) sync.textContent = "";
      const el = document.getElementById("sectionPulse");
      if (el) el.innerHTML = buildPulseHtml(data || {});
    }

    async function fetchPulseFeed() {
      const paths = ["market_pulse.json", "web/market_pulse.json", "web/news_data.json"];
      for (const p of paths) {
        try {
          const r = await fetch(`${assetUrl(p)}?ts=${Date.now()}`, { cache: "no-store" });
          if (!r.ok) continue;
          return await readJsonResponse(r);
        } catch (e) {
          console.warn("pulse fetch", p, e);
        }
      }
      return null;
    }

    async function loadPulseContent() {
      const sync = document.getElementById("pulseSyncNote");
      if (sync) sync.textContent = "Đang tải tin cập nhật…";
      const data = await fetchPulseFeed();
      if (!data) {
        if (sync) sync.textContent = "Không tải được market_pulse.json.";
        cachedPulsePayload = { events: [], lookback_hours: 48 };
        renderPulsePage(cachedPulsePayload);
        return;
      }
      cachedPulsePayload = data;
      renderPulsePage(data);
    }

    function buildBriefParts(data) {
      return buildDigestBriefParts(data);
    }

    function renderBriefSections(payload) {
      applyHeroBranding(payload);
      updateSiteNav();
      let parts;
      try {
        parts = buildBriefParts(payload);
      } catch (e) {
        console.error(e);
        const fall = document.getElementById("sectionThesis");
        if (fall) {
          fall.innerHTML = `<div class="error-card">Không tải được bản tin: ${escapeHtml(e.message || e)}</div>`;
        }
        return;
      }
      const thesisEl = document.getElementById("sectionThesis");
      if (thesisEl) thesisEl.innerHTML = parts.thesis || "";
      const artIdx = document.getElementById("sectionArticleIndex");
      if (artIdx) {
        artIdx.innerHTML = parts.articleIndex || "";
        artIdx.style.display = parts.articleIndex ? "" : "none";
      }
    }

    function isPayloadUsable(payload) {
      if (!payload || typeof payload !== "object") return false;
      const sectors = payload.digestSectors || payload.globalMacroDrivers;
      if (Array.isArray(sectors) && sectors.length > 0) return true;
      const mt = payload.mainThesis;
      return Boolean(mt && typeof mt === "object" && String(mt.thesis || "").trim());
    }

    function renderPage(data) {
      applyViewMode("digest");
      const payload = normalizeContentPayload(data && typeof data === "object" ? data : {});
      cachedDigestPayload = payload;
      const sync = document.getElementById("syncNote");
      if (sync) {
        const st = payload.generatedAt ? formatDateVi(payload.generatedAt) : "";
        sync.textContent = st ? `Tin tức được tổng hợp lúc ${st}.` : "";
      }
      const embeddedBrief = document.getElementById("brief")?.getAttribute("data-embedded-brief") === "1";
      const usable = isPayloadUsable(payload);
      if (usable || !embeddedBrief) {
        renderBriefSections(payload);
      } else {
        applyHeroBranding(payload);
      }
      const refSec = document.getElementById("reference");
      if (refSec) refSec.style.display = usable ? "none" : "";
      const grid = document.getElementById("sourceGrid");
      if (grid) grid.innerHTML = "";
      const titleEl = document.getElementById("sourceGridTitle");
      if (titleEl) titleEl.textContent = "Nguồn tin tức";
      const descEl = document.getElementById("sourceGridDesc");
      if (descEl) {
        descEl.textContent = "Nội dung được tổng hợp từ các nguồn tin trong 48 giờ qua.";
      }
    }

    async function loadFeedConfig() {
      try {
        const r = await fetch(assetUrl("feed-config.json"));
        if (!r.ok) return { preferLocal: true };
        const j = await readJsonResponse(r);
        if (j.preferLocal === undefined) j.preferLocal = true;
        return j;
      } catch {
        return { preferLocal: true };
      }
    }

    async function fetchLocalFeed() {
      try {
        const r = await fetch(`${assetUrl("content.json")}?ts=${Date.now()}`, { cache: "no-store" });
        if (!r.ok) throw new Error("bad");
        return await readJsonResponse(r);
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    async function loadChatContent() {
      const sync = document.getElementById("syncNote");
      if (sync) sync.textContent = "Đang tải brief…";
      try {
        const config = await loadFeedConfig();
        const remoteUrl = config.remoteFeedUrl || "";
        const preferLocal = Boolean(config.preferLocal);
        let data;
        if (preferLocal) data = await fetchLocalFeed();
        else if (remoteUrl) {
          try {
            const r = await fetch(remoteUrl, { cache: "no-store" });
            if (!r.ok) throw new Error("bad remote");
            data = await readJsonResponse(r);
          } catch {
            data = await fetchLocalFeed();
          }
        } else data = await fetchLocalFeed();
        if (!data) {
          if (sync) {
            const emb = document.getElementById("brief")?.getAttribute("data-embedded-brief") === "1";
            sync.textContent = emb
              ? "Hiển thị bản brief đóng gói sẵn — không tải được content.json (thử Ctrl+F5 hoặc kiểm tra mạng)."
              : "Không tải được content.json.";
          }
          return;
        }
        renderPage(data);
      } catch (err) {
        console.error(err);
        if (sync) sync.textContent = "Lỗi khi tải brief.";
      }
    }

    function startBriefApp() {
      const boot = () => {
        bindNavTabs();
        void switchView(currentView(), { replace: true, skipHistory: true });
      };
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
      window.addEventListener("popstate", () => {
        void switchView(currentView(), { skipHistory: true });
      });
    }
    startBriefApp();
  </script>
</body>
</html>
