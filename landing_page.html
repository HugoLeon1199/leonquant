<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEON Quant Labs — Tổng hợp tin tức 48 giờ</title>
  <meta name="description" content="Tổng hợp tin tức thế giới và Việt Nam trong 48 giờ qua — theo lĩnh vực, kèm liên kết nguồn.">
  <style>
    :root {
      --bg0: #05080f;
      --bg1: #0c1220;
      --bg2: #111a2e;
      --glass: rgba(255, 255, 255, .055);
      --border: rgba(255, 255, 255, .12);
      --text: #e8edf5;
      --muted: #94a3b8;
      --faint: #64748b;
      --cyan: #22d3ee;
      --cyan-dim: #0891b2;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      line-height: 1.55;
      background:
        radial-gradient(ellipse 120% 80% at 10% -10%, rgba(34, 211, 238, .1), transparent 50%),
        radial-gradient(ellipse 90% 60% at 90% 10%, rgba(251, 191, 36, .06), transparent 45%),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 40%, var(--bg2) 100%);
      min-height: 100vh;
    }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { width: min(1020px, 92%); margin: 0 auto; }

    .hero {
      padding: 28px 0 48px;
      border-bottom: 1px solid var(--border);
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -.03em;
      font-size: 1.02rem;
    }
    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      display: grid;
      place-items: center;
      font-size: .72rem;
      font-weight: 900;
      color: #0a0f18;
    }
    .nav-links { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .84rem; font-weight: 600; }
    .nav-links a { color: var(--muted); }
    .nav-links a:hover { color: var(--text); }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(1.85rem, 4.5vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }
    .hero-sub {
      font-size: 1.08rem;
      color: var(--muted);
      margin: 0 0 12px;
      font-weight: 650;
    }
    .hero-desc { margin: 0 0 16px; max-width: 58ch; color: var(--faint); }
    .hero-qs {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: .95rem;
    }
    .hero-qs li::before { content: "— "; color: var(--gold); }

    section { padding: 44px 0; }
    section.alt { background: rgba(0,0,0,.16); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    .eyebrow {
      margin: 0 0 6px;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(1.2rem, 2.8vw, 1.55rem);
      letter-spacing: -.03em;
    }
    .section-head p { margin: 8px 0 0; max-width: 68ch; color: var(--muted); font-size: .94rem; }
    .section-head { margin-bottom: 18px; }

    .thesis-block {
      border-radius: 18px;
      padding: 22px 24px;
      background: linear-gradient(145deg, rgba(34, 211, 238, .07), rgba(251, 191, 36, .06));
      border: 1px solid var(--border);
    }
    .thesis-block p { margin: 0 0 12px; color: #e2e8f0; }
    .thesis-block p:last-child { margin-bottom: 0; }
    .lbl { font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }

    .cards {
      display: grid;
      gap: 14px;
    }
    @media (min-width: 860px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
    }
    .card {
      border-radius: 14px;
      padding: 18px;
      background: var(--glass);
      border: 1px solid var(--border);
    }
    .card h3 { margin: 0 0 10px; font-size: 1rem; }
    .card .sub { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-top: 10px; }
    .card .body { margin: 0; font-size: .9rem; color: var(--muted); }

    .chain-list { margin: 12px 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .9rem; }

    .data-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); margin-top: 12px; }
    table.data {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
    }
    table.data th, table.data td {
      padding: 11px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    table.data th {
      background: rgba(0,0,0,.32);
      font-weight: 800;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--faint);
      white-space: nowrap;
    }
    table.data tr:last-child td { border-bottom: none; }
    table.data td { color: var(--muted); }

    .scenario-grid {
      display: grid;
      gap: 14px;
    }
    @media (min-width: 860px) {
      .scenario-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .sc {
      border-radius: 14px;
      padding: 18px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-top: 3px solid var(--cyan);
    }
    .sc.bull { border-top-color: #4ade80; }
    .sc.bear { border-top-color: #fb7185; }
    .sc h3 { margin: 0 0 8px; font-size: .98rem; }
    .sc p { margin: 0; font-size: .88rem; color: var(--muted); }

    .takeaway {
      border-radius: 16px;
      padding: 20px;
      background: rgba(251, 191, 36, .07);
      border: 1px solid rgba(251, 191, 36, .25);
    }
    .takeaway p { margin: 0; color: #e2e8f0; font-size: .98rem; }

    .secondary-head h2 { font-size: 1.1rem; color: var(--faint); }

    .brief-block { margin-bottom: 32px; }
    .brief-block:last-of-type { margin-bottom: 8px; }

    .subhead { font-size: 0.9rem; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
    .compact-regime p { margin: 0 0 8px; font-size: 0.9rem; }
    .two-col-triggers { display: grid; gap: 16px; }
    @media (min-width: 720px) {
      .two-col-triggers { grid-template-columns: 1fr 1fr; }
    }

    section.reference-secondary {
      opacity: 0.92;
      padding-top: 36px;
      padding-bottom: 48px;
    }
    section.reference-secondary .section-head h2 {
      font-size: 1.02rem;
    }

    .source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
      gap: 16px;
    }
    .source-card {
      border-radius: 16px;
      overflow: hidden;
      background: var(--glass);
      border: 1px solid var(--border);
      opacity: .92;
    }
    .source-card a { color: inherit; text-decoration: none !important; display: block; }
    .source-image {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      background: var(--bg2);
    }
    .fallback-image {
      display: grid;
      place-items: center;
      height: 120px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: var(--cyan);
      font-weight: 800;
      font-size: .7rem;
      letter-spacing: .12em;
    }
    .source-body { padding: 14px; }
    .source-meta { font-size: .75rem; color: var(--faint); margin-bottom: 6px; }
    .source-body h3 { margin: 0 0 6px; font-size: .95rem; }
    .source-body p { margin: 0; font-size: .85rem; color: var(--muted); line-height: 1.45; }
    .read-pill { display: inline-block; margin-top: 10px; font-size: .8rem; font-weight: 800; color: var(--cyan); }

    .sync-note { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
    .error-card {
      padding: 20px;
      border-radius: 14px;
      background: rgba(251, 113, 133, .08);
      border: 1px solid rgba(251, 113, 133, .28);
      color: var(--muted);
    }
    .footer {
      padding: 24px 0;
      border-top: 1px solid var(--border);
      color: var(--faint);
      font-size: .85rem;
    }

    /* —— Digest mode (bản tin đa ngành) —— */
    .digest-toc {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
      padding: 0;
      list-style: none;
    }
    .digest-toc a {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 700;
      background: rgba(34, 211, 238, .08);
      border: 1px solid rgba(34, 211, 238, .22);
      color: var(--cyan);
      text-decoration: none !important;
    }
    .digest-toc a:hover { background: rgba(34, 211, 238, .16); }

    .link-index-panel {
      border-radius: 16px;
      padding: 18px 20px;
      background: rgba(34, 211, 238, .05);
      border: 1px solid rgba(34, 211, 238, .2);
      margin-bottom: 8px;
    }
    .link-index-panel .hint {
      margin: 0 0 14px;
      font-size: .88rem;
      color: var(--muted);
    }
    .link-group { margin-bottom: 16px; }
    .link-group:last-child { margin-bottom: 0; }
    .link-group h3 {
      margin: 0 0 8px;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .link-rows { margin: 0; padding: 0; list-style: none; }
    .link-rows li {
      margin: 0 0 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, .22);
      border: 1px solid var(--border);
      font-size: .86rem;
      line-height: 1.4;
    }
    .link-rows a {
      font-weight: 650;
      word-break: break-word;
    }
    .link-rows .link-meta {
      display: block;
      margin-top: 3px;
      font-size: .74rem;
      color: var(--faint);
      font-weight: 600;
    }

    .sectors-index {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, .18);
      border: 1px solid var(--border);
    }
    .sectors-index .lbl-inline {
      margin: 0 0 10px;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .sectors-index ol {
      margin: 0;
      padding: 0 0 0 1.2rem;
      columns: 2;
      column-gap: 24px;
      font-size: .88rem;
      line-height: 1.55;
    }
    @media (max-width: 640px) {
      .sectors-index ol { columns: 1; }
    }
    .sectors-index a { font-weight: 650; text-decoration: none !important; }
    .sectors-index a:hover { text-decoration: underline !important; }

    .sector-block {
      border-radius: 16px;
      padding: 0;
      margin-bottom: 18px;
      background: var(--glass);
      border: 1px solid var(--border);
      scroll-margin-top: 72px;
      overflow: hidden;
    }
    .sector-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, .15);
    }
    .sector-num {
      flex-shrink: 0;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: .78rem;
      font-weight: 800;
      color: var(--bg0);
      background: linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    }
    .sector-head h3 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -.02em;
      line-height: 1.35;
    }
    .sector-mini-toc {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 20px 14px;
      margin: 0;
      list-style: none;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      background: rgba(34, 211, 238, .03);
    }
    .sector-mini-toc li { margin: 0; }
    .sector-mini-toc a {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: .74rem;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid transparent;
      text-decoration: none !important;
    }
    .sector-mini-toc a:hover {
      color: var(--cyan);
      border-color: rgba(34, 211, 238, .25);
      background: rgba(34, 211, 238, .08);
    }
    .sector-body { padding: 16px 20px 20px; }
    .sector-part {
      scroll-margin-top: 88px;
      padding-top: 4px;
      margin-bottom: 18px;
    }
    .sector-part:last-child { margin-bottom: 0; }
    .sector-part-title {
      margin: 0 0 10px;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .sector-block .sector-summary {
      margin: 0;
      color: #cbd5e1;
      font-size: .92rem;
      line-height: 1.65;
    }
    .sector-points {
      margin: 0;
      padding-left: 1.15rem;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.55;
    }
    .sector-points li { margin-bottom: 8px; }

    .overview-mini-toc {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 16px;
      padding: 0 0 14px;
      border-bottom: 1px solid var(--border);
      list-style: none;
    }
    .overview-mini-toc a {
      padding: 5px 11px;
      border-radius: 8px;
      font-size: .76rem;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid var(--border);
      text-decoration: none !important;
    }
    .overview-mini-toc a:hover {
      color: var(--cyan);
      border-color: rgba(34, 211, 238, .3);
    }
    .overview-part { scroll-margin-top: 88px; margin-bottom: 16px; }
    .overview-part:last-child { margin-bottom: 0; }
    ul.prose-bullets { margin: 0.35em 0 0; padding-left: 1.2rem; }
    ul.prose-bullets li { margin-bottom: 0.5em; line-height: 1.58; }
    ul.prose-bullets li:last-child { margin-bottom: 0; }

    .digest-main-panel {
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 8px;
      background: linear-gradient(145deg, rgba(34, 211, 238, .06), rgba(0, 0, 0, .12));
      border: 1px solid rgba(34, 211, 238, .18);
    }
    .digest-main-exec {
      margin-bottom: 22px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .digest-main-sectors .sector-block:first-of-type {
      margin-top: 4px;
    }

    .prose-block p {
      margin: 0 0 12px;
      color: #cbd5e1;
      font-size: .94rem;
      line-height: 1.65;
    }
    .prose-block p:last-child { margin-bottom: 0; }

    .article-index-wrap {
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, .2);
      overflow: hidden;
    }
    .article-index-wrap summary {
      cursor: pointer;
      padding: 14px 18px;
      font-weight: 750;
      font-size: .92rem;
      color: var(--text);
      list-style: none;
    }
    .article-index-wrap summary::-webkit-details-marker { display: none; }
    .article-index-scroll {
      max-height: 420px;
      overflow-y: auto;
      padding: 0 14px 14px;
      border-top: 1px solid var(--border);
    }
    .article-link-rows li { font-size: .82rem; }

    body.digest-mode .source-grid { display: none; }
    body.digest-mode .hero-qs { display: none; }
    body.digest-mode .hero h1,
    body.digest-mode .hero-sub,
    body.digest-mode .hero-desc { display: none; }
    body.digest-mode .hero { padding: 22px 0 28px; }
    body.digest-mode .nav-links { display: none; }
    body.digest-mode .logo {
      font-size: clamp(1.55rem, 4vw, 2.35rem);
      gap: 16px;
      letter-spacing: -.04em;
    }
    body.digest-mode .logo-mark {
      width: 56px;
      height: 56px;
      font-size: 1.05rem;
      border-radius: 15px;
    }

    .digest-report { scroll-margin-top: 88px; }
    .digest-report-head { margin-bottom: 1rem; }
    .digest-report-head h2 {
      margin: 0 0 0.45rem;
      font-size: clamp(1.25rem, 2.6vw, 1.65rem);
      line-height: 1.25;
    }
    .digest-report-lead {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
      max-width: 42rem;
    }
    .digest-report-extra { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    body.digest-mode #sectionDigestHighlights { display: none !important; }
    body.digest-mode #reference { display: none !important; }
    .digest-notable-all { margin-top: 0.75rem; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container">
      <nav class="nav">
        <div class="logo"><span class="logo-mark">LQ</span> LEON Quant Labs</div>
        <div class="nav-links" id="navLinks"></div>
      </nav>
      <h1>LEON Quant Labs</h1>
      <p class="hero-sub" id="heroSubtitle"></p>
      <p class="hero-desc" id="heroDescription"></p>
    </div>
  </header>

  <main>
    <section id="brief" class="alt">
      <div class="container">
        <p id="syncNote" class="sync-note"></p>
        <div id="sectionThesis" class="brief-block"></div>
      </div>
    </section>

    <section id="reference" class="reference-secondary">
      <div class="container" style="max-width: min(1180px, 95%);">
        <div class="section-head secondary-head">
          <p class="eyebrow">Tham khảo</p>
          <h2 id="sourceGridTitle">Nguồn tin tức</h2>
          <p id="sourceGridDesc">Nội dung được tổng hợp từ các nguồn tin trong 48 giờ qua.</p>
        </div>
        <div id="sectionArticleIndex" class="brief-block"></div>
        <div id="sourceGrid" class="source-grid"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 LEON Quant Labs</p>
    </div>
  </footer>

  <!-- Rocket Loader (Cloudflare) có thể làm lệch script inline; tắt cho block này -->
  <script data-cfasync="false">
    const ND = "—";

    /** Gốc site để fetch content.json / feed-config đúng dù trang mở tại /landing_page/ hay /repo/landing_page/ */
    function siteBaseUrl() {
      if (window.location.protocol === "file:") {
        return new URL(".", window.location.href).href;
      }
      const host = window.location.hostname.replace(/^www\./, "").toLowerCase();
      if (host === "leonquant.com") {
        return `${window.location.origin}/`;
      }
      let path = window.location.pathname.replace(/\/$/, "");
      for (const suf of ["/index.html", "/landing_page.html", "/landing_page"]) {
        if (path.endsWith(suf)) {
          path = path.slice(0, -suf.length);
          break;
        }
      }
      if (path.endsWith(".html")) {
        path = path.slice(0, path.lastIndexOf("/"));
      }
      const dir = path === "" ? "/" : path + "/";
      return new URL(dir, window.location.origin).href;
    }

    function assetUrl(filename) {
      const name = String(filename).replace(/^\//, "");
      return new URL(name, siteBaseUrl()).href;
    }

    /** JSON từ mạng đôi khi có BOM (UTF-8) — JSON.parse sẽ lỗi nếu không bỏ. */
    async function readJsonResponse(response) {
      const text = await response.text();
      return JSON.parse(String(text).replace(/^\uFEFF/, "").trim());
    }

    function normalizeContentPayload(raw) {
      if (!raw || typeof raw !== "object") return raw;
      if (raw.briefMode === "multisector-digest") return raw;
      if (Array.isArray(raw.digestSectors) && raw.digestSectors.length) {
        return { ...raw, briefMode: "multisector-digest" };
      }
      return raw;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateVi(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString("vi-VN", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    function getHostName(u) {
      try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; }
    }

    function applyHeroBranding(data) {
      const digestMode = data.briefMode === "multisector-digest";
      const pub = data.publicationIntro || {};
      const heroSub = document.getElementById("heroSubtitle");
      const heroDesc = document.getElementById("heroDescription");
      if (heroSub) {
        if (digestMode) {
          heroSub.textContent = "";
          heroSub.style.display = "none";
        } else {
          heroSub.style.display = "";
          heroSub.textContent =
            (data.sectionLabel && String(data.sectionLabel).trim()) ||
            pub.headline ||
            heroSub.textContent;
        }
      }
      if (heroDesc) {
        if (digestMode) {
          heroDesc.textContent = "";
          heroDesc.style.display = "none";
        } else {
          const short =
            String(pub.description || "").trim().slice(0, 220) ||
            "Tóm tắt đầy đủ và liên kết nguồn nằm ngay bên dưới.";
          heroDesc.textContent = short + (String(pub.description || "").length > 220 ? "…" : "");
        }
      }
    }

    function proseToBullets(text) {
      const raw = String(text || "").trim();
      if (!raw) return [];
      if (/^\s*[-•*]\s/m.test(raw)) {
        return raw
          .split(/\n+/)
          .map((ln) => ln.replace(/^\s*[-•*]\s+/, "").trim())
          .filter(Boolean);
      }
      const out = [];
      const paras = raw.includes("\n\n") ? raw.split(/\n\s*\n/) : [raw];
      for (const para of paras) {
        const p = para.replace(/\s+/g, " ").trim();
        if (!p) continue;
        const chunks = p.split(/(?<=[.!?…])\s+(?=["'“‘(A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƠƯ0-9])/);
        const parts = chunks.length > 1 ? chunks : p.split(/(?<=[;])\s+/);
        for (const c of parts) {
          const t = c.trim();
          if (t.length >= 18) out.push(t);
        }
      }
      return out.length ? out : [raw];
    }

    function getDigestBullets(data, arrayKey, fallbackText) {
      const arr = data[arrayKey];
      if (Array.isArray(arr) && arr.length) {
        return arr.map((s) => String(s || "").trim()).filter(Boolean);
      }
      return proseToBullets(fallbackText);
    }

    function buildProseBulletsHtml(items) {
      if (!items.length) return `<p>${escapeHtml(ND)}</p>`;
      let h = `<ul class="sector-points prose-bullets">`;
      for (const it of items) h += `<li>${escapeHtml(it)}</li>`;
      h += `</ul>`;
      return h;
    }

    function mergeOverviewBullets(exec, intl, vn) {
      const seen = new Set();
      const out = [];
      for (const list of [exec, intl, vn]) {
        for (const b of list) {
          const t = String(b || "").trim();
          if (!t) continue;
          const key = t.toLowerCase().slice(0, 80);
          if (seen.has(key)) continue;
          seen.add(key);
          out.push(t);
        }
      }
      return out;
    }

    function sectorSlug(name) {
      return (
        "sector-" +
        String(name || "linh-vuc")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "")
      );
    }

    function ensureDigestSectors(data) {
      if (Array.isArray(data.digestSectors) && data.digestSectors.length) {
        return data.digestSectors.filter((s) => s && typeof s === "object");
      }
      const drivers = Array.isArray(data.globalMacroDrivers) ? data.globalMacroDrivers : [];
      return drivers.map((d) => ({
        name: d.title || "Lĩnh vực",
        summary: d.analysis || "",
        keyPoints: String(d.marketImpact || "")
          .split("\n")
          .map((x) => x.replace(/^•\s*/, "").trim())
          .filter(Boolean),
        links: [],
      }));
    }

    function buildLinkRowsHtml(links) {
      if (!links.length) return `<p class="hint">Chưa có liên kết nguồn.</p>`;
      let h = `<ul class="link-rows">`;
      for (const L of links) {
        const u = String(L.url || "").trim();
        if (!u) continue;
        const title = escapeHtml(L.title || L.host || u);
        const meta = [L.source, L.host].filter(Boolean).join(" · ");
        h += `<li><a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${title}</a>`;
        if (meta) h += `<span class="link-meta">${escapeHtml(meta)}</span>`;
        h += `</li>`;
      }
      h += `</ul>`;
      return h;
    }

    function buildDigestLinkIndexHtml(data) {
      const index = Array.isArray(data.digestLinkIndex) ? data.digestLinkIndex : [];
      const groups = new Map();
      for (const row of index) {
        if (!row || typeof row !== "object") continue;
        const g = String(row.group || row.sector || "Khác").trim() || "Khác";
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(row);
      }
      let html = `<div class="section-head"><p class="eyebrow">Liên kết</p><h2>Chỉ mục nguồn & bài đọc</h2></div>`;
      html += `<div class="link-index-panel"><p class="hint">Liên kết trỏ tới bài báo gốc — nhấn để mở tab mới và đối chiếu. Nhóm theo lĩnh vực.</p>`;
      for (const [group, rows] of groups) {
        html += `<div class="link-group"><h3>${escapeHtml(group)} (${rows.length})</h3>`;
        html += buildLinkRowsHtml(rows);
        html += `</div>`;
      }
      html += `</div>`;
      return html;
    }

    function sectorPartId(sectorId, part) {
      return `${sectorId}--${part}`;
    }

    function buildSectorMiniToc(sectorId, items) {
      if (!items.length) return "";
      let h = `<ul class="sector-mini-toc" aria-label="Mục lục trong lĩnh vực">`;
      for (const it of items) {
        h += `<li><a href="#${sectorPartId(sectorId, it.id)}">${escapeHtml(it.label)}</a></li>`;
      }
      h += `</ul>`;
      return h;
    }

    function buildSectorsIndexHtml(sectors) {
      let h = `<div class="sectors-index"><p class="lbl-inline">Mục lục ${sectors.length} lĩnh vực</p><ol>`;
      for (let i = 0; i < sectors.length; i++) {
        const name = String(sectors[i].name || "").trim();
        if (!name) continue;
        const id = sectorSlug(name);
        h += `<li><a href="#${id}">${i + 1}. ${escapeHtml(name)}</a></li>`;
      }
      h += `</ol></div>`;
      return h;
    }

    function collectDigestNotableLinks(notable, sectors, articles) {
      const seen = new Set();
      const out = [];
      const push = (row) => {
        if (!row || typeof row !== "object") return;
        const u = String(row.url || "").trim();
        if (!u || seen.has(u)) return;
        seen.add(u);
        out.push({
          url: u,
          title: row.title || row.host || u,
          source: row.source || "",
          host: row.host || getHostName(u),
        });
      };
      for (const a of notable) {
        push({
          url: a.url,
          title: a.title,
          source: [a.source, a.whyNotable].filter(Boolean).join(" · "),
          host: getHostName(a.url || ""),
        });
      }
      for (const s of sectors) {
        for (const L of Array.isArray(s.links) ? s.links : []) push(L);
      }
      for (const a of articles) push(a);
      return out;
    }

    function buildSectorBlockHtml(s, index) {
      const name = String(s.name || "").trim() || "Lĩnh vực";
      const id = sectorSlug(name);
      const pts = Array.isArray(s.keyPoints) ? s.keyPoints : [];
      const hasSummary = Boolean(String(s.summary || "").trim());

      let h = `<article class="sector-block" id="${id}">`;
      h += `<header class="sector-head"><span class="sector-num">${String(index + 1).padStart(2, "0")}</span>`;
      h += `<h3>${escapeHtml(name)}</h3></header>`;
      h += `<div class="sector-body">`;

      if (hasSummary) {
        h += `<p class="sector-summary">${escapeHtml(s.summary)}</p>`;
      }
      if (pts.length) {
        h += `<ul class="sector-points">`;
        for (const p of pts) h += `<li>${escapeHtml(p)}</li>`;
        h += `</ul>`;
      }
      if (!hasSummary && !pts.length) {
        h += `<p class="hint">Chưa có nội dung chi tiết cho lĩnh vực này.</p>`;
      }
      h += `</div></article>`;
      return h;
    }

    function buildDigestBriefParts(data) {
      const mt = data.mainThesis || {};
      const sectors = ensureDigestSectors(data);
      const vn = String(data.digestVietnamHighlights || "").trim();
      const intl = String(data.digestInternationalHighlights || "").trim();
      const gaps = String(data.digestGapsAndLimits || "").trim();
      const notable = Array.isArray(data.digestNotableArticles) ? data.digestNotableArticles : [];
      const execBullets = getDigestBullets(data, "digestExecutiveBullets", mt.thesis || "");
      const intlBullets = getDigestBullets(
        data,
        "digestInternationalBullets",
        intl,
      );
      const vnBullets = getDigestBullets(data, "digestVietnamBullets", vn);
      const overviewBullets = mergeOverviewBullets(execBullets, intlBullets, vnBullets);

      const reportTitle =
        String(data.digestReportTitle || "").trim() ||
        "Tổng hợp tin tức toàn cầu và Việt Nam (48 giờ)";

      const mainToc = [];
      if (overviewBullets.length) mainToc.push({ id: "overview", label: "Tổng quan" });
      if (sectors.length) mainToc.push({ id: "sectors", label: "Chi tiết theo lĩnh vực" });
      for (const s of sectors) {
        const name = String(s.name || "").trim();
        if (!name) continue;
        mainToc.push({ id: sectorSlug(name), label: name, external: true });
      }
      const articles = Array.isArray(data.articleLinkIndex) ? data.articleLinkIndex : [];
      const notableLinks = collectDigestNotableLinks(notable, sectors, []);
      if (notableLinks.length || articles.length) {
        mainToc.push({ id: "notable", label: "Tin đáng chú ý" });
      }

      let thesisHtml = `<article id="digest-report" class="digest-report">`;
      thesisHtml += `<header class="digest-report-head">`;
      thesisHtml += `<h2>${escapeHtml(reportTitle)}</h2>`;
      thesisHtml += `</header>`;
      thesisHtml += `<div class="digest-main-panel">`;
      if (mainToc.length) {
        thesisHtml += `<ul class="overview-mini-toc" aria-label="Mục lục bản tin">`;
        for (const it of mainToc) {
          const href = it.external ? `#${it.id}` : `#digest-main--${it.id}`;
          thesisHtml += `<li><a href="${href}">${escapeHtml(it.label)}</a></li>`;
        }
        thesisHtml += `</ul>`;
      }
      if (overviewBullets.length) {
        thesisHtml += `<section class="overview-part" id="digest-main--overview">`;
        thesisHtml += `<p class="sector-part-title">Tổng quan</p>`;
        thesisHtml += buildProseBulletsHtml(overviewBullets);
        thesisHtml += `</section>`;
      }
      thesisHtml += `<section class="digest-main-sectors overview-part" id="digest-main--sectors">`;
      thesisHtml += `<p class="sector-part-title">Chi tiết theo lĩnh vực</p>`;
      if (!sectors.length) {
        thesisHtml += `<p class="error-card">Chưa có lĩnh vực trong digest.</p>`;
      } else {
        thesisHtml += buildSectorsIndexHtml(sectors);
        for (let i = 0; i < sectors.length; i++) {
          thesisHtml += buildSectorBlockHtml(sectors[i], i);
        }
      }
      thesisHtml += `</section>`;
      if (notableLinks.length || articles.length) {
        thesisHtml += `<section class="overview-part digest-report-extra" id="digest-main--notable">`;
        thesisHtml += `<p class="sector-part-title">Tin đáng chú ý</p>`;
        if (notableLinks.length) {
          thesisHtml += buildLinkRowsHtml(
            notableLinks.map((a) => ({
              url: a.url,
              title: a.title,
              source: a.source,
              host: a.host || getHostName(a.url || ""),
            })),
          );
        }
        if (articles.length) {
          thesisHtml += `<details class="article-index-wrap digest-notable-all">`;
          thesisHtml += `<summary>Bấm vào xem chi tiết</summary>`;
          thesisHtml += `<div class="article-index-scroll">`;
          thesisHtml += buildLinkRowsHtml(
            articles.map((a) => ({
              url: a.url,
              title: a.title,
              source: [a.source, formatDateVi(a.publishedAt)].filter(Boolean).join(" · "),
              host: a.host || getHostName(a.url || ""),
            })),
          );
          thesisHtml += `</div></details>`;
        }
        thesisHtml += `</section>`;
      }
      if (gaps) {
        thesisHtml += `<section class="overview-part digest-report-extra" id="digest-main--gaps">`;
        thesisHtml += `<p class="sector-part-title">Ghi chú</p><p class="hint">${escapeHtml(gaps)}</p></section>`;
      }
      thesisHtml += `</div></article>`;

      return {
        linkIndex: "",
        thesis: thesisHtml,
        whatChanged: "",
        digestHighlights: "",
        regime: "",
        macro: "",
        intermarket: "",
        transmission: "",
        actions: "",
        allocation: "",
        priority: "",
        riskOn: "",
        riskOff: "",
        intraday: "",
        scenarios: "",
        triggers: "",
        finalDecision: "",
        articleIndex: "",
      };
    }

    function updateDigestNav() {
      const nav = document.getElementById("navLinks");
      if (!nav) return;
      nav.innerHTML = "";
      document.body.classList.add("digest-mode");
    }

    function buildBriefParts(data) {
      return buildDigestBriefParts(data);
    }

    function renderBriefSections(payload) {
      applyHeroBranding(payload);
      updateDigestNav();
      let parts;
      try {
        parts = buildBriefParts(payload);
      } catch (e) {
        console.error(e);
        const fall = document.getElementById("sectionThesis");
        if (fall) {
          fall.innerHTML = `<div class="error-card">Không tải được bản tin: ${escapeHtml(e.message || e)}</div>`;
        }
        return;
      }
      const thesisEl = document.getElementById("sectionThesis");
      if (thesisEl) thesisEl.innerHTML = parts.thesis || "";
      const artIdx = document.getElementById("sectionArticleIndex");
      if (artIdx) {
        artIdx.innerHTML = parts.articleIndex || "";
        artIdx.style.display = parts.articleIndex ? "" : "none";
      }
    }

    function isPayloadUsable(payload) {
      if (!payload || typeof payload !== "object") return false;
      const sectors = payload.digestSectors || payload.globalMacroDrivers;
      if (Array.isArray(sectors) && sectors.length > 0) return true;
      const mt = payload.mainThesis;
      return Boolean(mt && typeof mt === "object" && String(mt.thesis || "").trim());
    }

    function renderPage(data) {
      const payload = normalizeContentPayload(data && typeof data === "object" ? data : {});
      const sync = document.getElementById("syncNote");
      if (sync) {
        const st = payload.generatedAt ? formatDateVi(payload.generatedAt) : "";
        sync.textContent = st ? `Tin tức được tổng hợp lúc ${st}.` : "";
      }
      const embeddedBrief = document.getElementById("brief")?.getAttribute("data-embedded-brief") === "1";
      const usable = isPayloadUsable(payload);
      if (usable || !embeddedBrief) {
        renderBriefSections(payload);
      } else {
        applyHeroBranding(payload);
      }
      const refSec = document.getElementById("reference");
      if (refSec) refSec.style.display = "";
      const grid = document.getElementById("sourceGrid");
      if (grid) grid.innerHTML = "";
      const titleEl = document.getElementById("sourceGridTitle");
      if (titleEl) titleEl.textContent = "Nguồn tin tức";
      const descEl = document.getElementById("sourceGridDesc");
      if (descEl) {
        descEl.textContent = "Nội dung được tổng hợp từ các nguồn tin trong 48 giờ qua.";
      }
    }

    async function loadFeedConfig() {
      try {
        const r = await fetch(assetUrl("feed-config.json"));
        if (!r.ok) return { preferLocal: true };
        const j = await readJsonResponse(r);
        if (j.preferLocal === undefined) j.preferLocal = true;
        return j;
      } catch {
        return { preferLocal: true };
      }
    }

    async function fetchLocalFeed() {
      try {
        const r = await fetch(`${assetUrl("content.json")}?ts=${Date.now()}`, { cache: "no-store" });
        if (!r.ok) throw new Error("bad");
        return await readJsonResponse(r);
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    async function loadChatContent() {
      const sync = document.getElementById("syncNote");
      if (sync) sync.textContent = "Đang tải brief…";
      try {
        const config = await loadFeedConfig();
        const remoteUrl = config.remoteFeedUrl || "";
        const preferLocal = Boolean(config.preferLocal);
        let data;
        if (preferLocal) data = await fetchLocalFeed();
        else if (remoteUrl) {
          try {
            const r = await fetch(remoteUrl, { cache: "no-store" });
            if (!r.ok) throw new Error("bad remote");
            data = await readJsonResponse(r);
          } catch {
            data = await fetchLocalFeed();
          }
        } else data = await fetchLocalFeed();
        if (!data) {
          if (sync) {
            const emb = document.getElementById("brief")?.getAttribute("data-embedded-brief") === "1";
            sync.textContent = emb
              ? "Hiển thị bản brief đóng gói sẵn — không tải được content.json (thử Ctrl+F5 hoặc kiểm tra mạng)."
              : "Không tải được content.json.";
          }
          return;
        }
        renderPage(data);
      } catch (err) {
        console.error(err);
        if (sync) sync.textContent = "Lỗi khi tải brief.";
      }
    }

    function startBriefApp() {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => void loadChatContent());
      } else {
        void loadChatContent();
      }
    }
    startBriefApp();
  </script>
</body>
</html>
