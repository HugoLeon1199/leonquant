<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Frontier Radar 72h | LeonQuant</title>
  <meta name="description" content="AI Frontier Radar 72h cua LeonQuant, tong hop cac tin dang chu y nhat trong 72 gio qua.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-strong: #ffffff;
      --border: rgba(15, 23, 42, 0.1);
      --text: #0f172a;
      --muted: #475569;
      --blue: #1d4ed8;
      --teal: #0f766e;
      --amber: #b45309;
      --rose: #be123c;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      --font-sans: "Be Vietnam Pro", system-ui, sans-serif;
      --font-alt: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: var(--font-sans);
      background:
        radial-gradient(circle at top left, rgba(29, 78, 216, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.14), transparent 24%),
        linear-gradient(180deg, #f9fbfd, var(--bg));
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { width: min(1280px, 94vw); margin: 0 auto; padding: 28px 0 60px; }
    .hero {
      border-radius: 28px;
      border: 1px solid var(--border);
      padding: 28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.96), rgba(239,246,255,0.92)),
        linear-gradient(180deg, rgba(15,118,110,0.06), transparent);
      box-shadow: var(--shadow);
    }
    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .kicker {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--teal);
      font-weight: 800;
    }
    h1 {
      margin: 10px 0 8px;
      font-size: clamp(2.1rem, 4.4vw, 3.8rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }
    .sub {
      margin: 0;
      max-width: 72ch;
      color: var(--muted);
      line-height: 1.65;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .stats-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .stat {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }
    .stat-label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--font-alt);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stat-value {
      display: block;
      margin-top: 8px;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .grid {
      margin-top: 24px;
      display: grid;
      gap: 20px;
    }
    .panel {
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 1.28rem;
      letter-spacing: -0.02em;
    }
    .summary-list,
    .idea-list,
    .knowledge-list,
    .link-list,
    .must-read-list {
      display: grid;
      gap: 14px;
    }
    .story-list {
      display: grid;
      gap: 14px;
    }
    .summary-item,
    .story-card,
    .idea-card,
    .knowledge-card,
    .link-card {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: var(--surface-strong);
    }
    .summary-item p,
    .story-card p,
    .idea-card p,
    .knowledge-card p,
    .link-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }
    .story-card h3,
    .idea-card h3,
    .knowledge-card h3,
    .link-card h3 {
      margin: 0 0 8px;
      font-size: 1.02rem;
      line-height: 1.4;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-family: var(--font-alt);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(29, 78, 216, 0.08);
      border: 1px solid rgba(29, 78, 216, 0.12);
      color: var(--blue);
      font-weight: 700;
    }
    .pill.warn {
      color: var(--amber);
      background: rgba(180, 83, 9, 0.08);
      border-color: rgba(180, 83, 9, 0.14);
    }
    .pill.hot {
      color: var(--rose);
      background: rgba(190, 18, 60, 0.08);
      border-color: rgba(190, 18, 60, 0.14);
    }
    .split {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }
    .triple {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.08);
      color: var(--teal);
      padding: 4px 10px;
      font-size: 0.76rem;
      font-weight: 700;
    }
    .error {
      margin-top: 24px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(220, 38, 38, 0.06);
      border: 1px solid rgba(220, 38, 38, 0.16);
      color: #991b1b;
    }
    @media (max-width: 980px) {
      .stats-grid,
      .triple,
      .split {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 760px) {
      .shell { width: min(94vw, 100%); padding-top: 18px; }
      .hero, .panel { padding: 18px; border-radius: 20px; }
      .stats-grid,
      .triple,
      .split {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="kicker">LeonQuant / AI Frontier Radar 72h</div>
          <h1>AI Frontier Radar 72h</h1>
          <p class="sub">Ban tong hop 72 gio qua, uu tien cac tin co gia tri hanh dong, link nguon ro rang va du de doc nhanh thay vi lan trong dong tin tho.</p>
        </div>
        <a class="home-link" href="/">Ve trang chinh</a>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <section class="grid" id="dashboard"></section>
    <div class="error" id="errorBox" hidden></div>
  </main>
  <script>
    const SECTION_LABELS = {
      ai_models: "AI Models",
      local_ai_china_ai: "Local AI / China AI",
      ai_tools: "AI Tools",
      automation_mcp_agents: "Tools & Automation",
      open_source_hot: "Open Source Hot",
      ai_business_money: "AI Business & Money",
      industry_impact: "Industry Impact",
      ai_knowledge: "AI Knowledge",
      founder_ideas_for_leon: "Apply Now for Leon",
      full_link_radar: "Full Link Radar"
    };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
    }

    function renderTags(tags) {
      const rows = Array.isArray(tags) ? tags.filter(Boolean).slice(0, 6) : [];
      if (!rows.length) return "";
      return `<div class="tag-row">${rows.map((tag) => `<span class="tag">${esc(tag)}</span>`).join("")}</div>`;
    }

    function renderMeta(parts) {
      const items = parts.filter(Boolean);
      if (!items.length) return "";
      return `<div class="meta">${items.map((part) => `<span>${esc(part)}</span>`).join("")}</div>`;
    }

    function renderMustReadCard(item) {
      const importanceClass = item.importance === "high" ? " hot" : "";
      return `
        <article class="story-card">
          ${renderMeta([
            item.category,
            item.source,
            item.source_count ? `${item.source_count} nguon` : "",
          ])}
          <div class="pill${importanceClass}">${esc(item.importance || "watch")}</div>
          <h3><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h3>
          <p>${esc(item.why_read)}</p>
          <p style="margin-top:10px;"><strong>Ap dung ngay:</strong> ${esc(item.apply_now)}</p>
          ${renderTags(item.tags)}
        </article>
      `;
    }

    function renderIdeaCard(item) {
      return `
        <article class="idea-card">
          <h3>${esc(item.title)}</h3>
          <p>${esc(item.summary)}</p>
          <p style="margin-top:10px;"><strong>Buoc tiep:</strong> ${esc(item.next_step || item.use_case || "")}</p>
        </article>
      `;
    }

    function renderKnowledgeCard(item) {
      return `
        <article class="knowledge-card">
          <h3>${esc(item.title)}</h3>
          <p>${esc(item.summary)}</p>
          <p style="margin-top:10px;"><strong>Cach dung:</strong> ${esc(item.use_case || item.next_step || "")}</p>
        </article>
      `;
    }

    function renderStoryCard(item) {
      return `
        <article class="story-card">
          ${renderMeta([
            item.category,
            item.source,
            item.published_at ? item.published_at.slice(0, 10) : "",
            item.source_count ? `${item.source_count} nguon` : "",
          ])}
          <h3><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h3>
          <p>${esc(item.why_read || item.why_interesting || item.summary || "")}</p>
          <p style="margin-top:10px;"><strong>Gia tri:</strong> ${esc(item.apply_now || item.use_case || "")}</p>
          ${renderTags(item.tags)}
        </article>
      `;
    }

    function renderLinkCard(item) {
      return `
        <article class="link-card">
          ${renderMeta([
            item.category,
            item.source,
            item.published_at ? item.published_at.slice(0, 10) : "",
          ])}
          <h3><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h3>
          <p>${esc(item.why_interesting)}</p>
          <p style="margin-top:10px;"><strong>Use case:</strong> ${esc(item.use_case)}</p>
        </article>
      `;
    }

    function renderSection(title, bodyHtml) {
      return `
        <section class="panel">
          <h2>${esc(title)}</h2>
          ${bodyHtml}
        </section>
      `;
    }

    function render(payload) {
      const dashboard = document.getElementById("dashboard");
      const stats = payload.stats || {};
      const sections = payload.sections || {};
      const mustRead = Array.isArray(payload.must_read) ? payload.must_read : [];
      const executiveSummary = Array.isArray(payload.executive_summary) ? payload.executive_summary : [];
      const windowHours = payload.window_hours || 72;

      document.getElementById("statsGrid").innerHTML = `
        <div class="stat"><span class="stat-label">Window</span><span class="stat-value">${esc(windowHours)}h</span></div>
        <div class="stat"><span class="stat-label">Must Read</span><span class="stat-value">${esc(mustRead.length)}</span></div>
        <div class="stat"><span class="stat-label">Radar Links</span><span class="stat-value">${esc((sections.full_link_radar || []).length)}</span></div>
        <div class="stat"><span class="stat-label">Tong Story</span><span class="stat-value">${esc(stats.story_count || 0)}</span></div>
      `;

      const blocks = [];

      blocks.push(renderSection(
        "Executive Summary",
        `<div class="summary-list">${executiveSummary.map((item) => `<div class="summary-item"><p>${esc(item)}</p></div>`).join("")}</div>`
      ));

      blocks.push(renderSection(
        "Must Read",
        `<div class="must-read-list">${mustRead.map(renderMustReadCard).join("")}</div>`
      ));

      blocks.push(renderSection(
        "Apply Now for Leon",
        `<div class="idea-list">${(sections.founder_ideas_for_leon || []).map(renderIdeaCard).join("")}</div>`
      ));

      blocks.push(renderSection(
        "Local AI / China AI",
        `<div class="story-list">${(sections.local_ai_china_ai || []).map(renderStoryCard).join("")}</div>`
      ));

      blocks.push(renderSection(
        "Tools & Automation",
        `<div class="split">
          <div class="story-list">${(sections.ai_tools || []).map(renderStoryCard).join("")}</div>
          <div class="story-list">${(sections.automation_mcp_agents || []).map(renderStoryCard).join("")}</div>
        </div>`
      ));

      blocks.push(renderSection(
        "Open Source Hot",
        `<div class="story-list">${(sections.open_source_hot || []).map(renderStoryCard).join("")}</div>`
      ));

      blocks.push(renderSection(
        "AI Knowledge",
        `<div class="knowledge-list">${(sections.ai_knowledge || []).map(renderKnowledgeCard).join("")}</div>`
      ));

      blocks.push(renderSection(
        "Industry Impact",
        `<div class="split">
          <div class="story-list">${(sections.industry_impact || []).map(renderStoryCard).join("")}</div>
          <div class="story-list">${(sections.ai_business_money || []).map(renderStoryCard).join("")}</div>
        </div>`
      ));

      blocks.push(renderSection(
        "AI Models",
        `<div class="story-list">${(sections.ai_models || []).map(renderStoryCard).join("")}</div>`
      ));

      blocks.push(renderSection(
        "Full Link Radar",
        `<div class="link-list">${(sections.full_link_radar || []).map(renderLinkCard).join("")}</div>`
      ));

      dashboard.innerHTML = blocks.join("");
    }

    async function fetchTechJson() {
      const path = "./data/publication.json";
      const resp = await fetch(`${path}?ts=${Date.now()}`, { cache: "no-store" });
      if (!resp.ok) {
        throw new Error("Khong tai duoc tech/data/publication.json");
      }
      return resp.json();
    }

    fetchTechJson()
      .then(render)
      .catch((err) => {
        const errorBox = document.getElementById("errorBox");
        errorBox.hidden = false;
        errorBox.textContent = String(err && err.message ? err.message : err);
      });
  </script>
</body>
</html>
