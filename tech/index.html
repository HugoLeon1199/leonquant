<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeonQuant — Công nghệ & AI 72h</title>
  <meta name="description" content="Bản tin Công nghệ và AI chọn lọc trong 72 giờ gần nhất.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f3f6fa; --surface:#fff; --text:#0f172a; --muted:#526174; --line:#dce3eb; --blue:#1d4ed8; --teal:#0f766e; --amber:#a16207; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Be Vietnam Pro",system-ui,sans-serif; color:var(--text); background:linear-gradient(180deg,#f8fbff,var(--bg)); }
    a { color:var(--blue); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .shell { width:min(1180px,94vw); margin:auto; padding:24px 0 60px; }
    .hero { padding:28px; border:1px solid var(--line); border-radius:24px; background:var(--surface); box-shadow:0 14px 38px rgba(15,23,42,.08); }
    .kicker { color:var(--teal); font-size:.75rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:8px 0 10px; font-size:clamp(2rem,5vw,3.6rem); line-height:1.05; }
    .lead { max-width:760px; color:var(--muted); line-height:1.7; }
    .topline { display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; }
    .stats { margin-top:18px; display:flex; flex-wrap:wrap; gap:8px; }
    .pill { padding:6px 11px; border-radius:999px; background:#eef4ff; color:var(--blue); font-size:.8rem; font-weight:700; }
    .sections { display:grid; gap:18px; margin-top:24px; }
    .section { padding:22px; border:1px solid var(--line); border-radius:22px; background:var(--surface); box-shadow:0 8px 28px rgba(15,23,42,.06); }
    .section h2 { margin:0 0 14px; font-size:1.25rem; }
    .stories { display:grid; gap:14px; }
    .story { padding:17px; border:1px solid #e7ecf2; border-radius:17px; background:#fcfdff; }
    .story h3 { margin:0 0 8px; font-size:1.05rem; line-height:1.4; }
    .story p { margin:0 0 10px; color:var(--muted); line-height:1.65; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:9px; font-size:.76rem; color:var(--muted); }
    .badge { padding:4px 9px; border-radius:999px; background:#e9f7f4; color:var(--teal); font-weight:700; }
    .badge.warn { background:#fff7df; color:var(--amber); }
    .use { padding:10px 12px; border-left:3px solid var(--teal); background:#f1faf8; border-radius:8px; }
    .links { margin:10px 0 0; padding-left:19px; }
    .links li { margin:6px 0; color:var(--muted); }
    .error { margin-top:20px; padding:16px; border:1px solid #fecaca; border-radius:14px; background:#fff1f2; color:#9f1239; }
    @media(max-width:700px){ .shell{width:95vw;padding-top:12px}.hero,.section{padding:17px;border-radius:17px}.story{padding:14px} }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="topline">
        <div class="kicker">LeonQuant / Tech 72h</div>
        <a href="/">Về trang chính</a>
      </div>
      <h1>Công nghệ &amp; AI</h1>
      <p class="lead">Các phát minh, sản phẩm, mã nguồn, hạ tầng và chính sách đáng chú ý trong 72 giờ gần nhất. Diễn đàn được dùng để phát hiện chủ đề, còn nhãn “Nóng” cần xác nhận từ báo độc lập hoặc nguồn chính thức.</p>
      <div class="stats" id="stats"><span class="pill">Đang tải bản tin…</span></div>
    </header>
    <div class="sections" id="sections"></div>
    <div class="error" id="error" hidden></div>
  </main>
  <script>
    const labels = {
      tong_quan:"Tổng quan 72 giờ", tin_nong:"Tin nóng", model_agent_moi:"Model và agent mới",
      cach_dung_ai:"Cách ứng dụng AI", open_source_developer_tools:"Mã nguồn và công cụ developer",
      chip_ha_tang:"Chip, GPU và hạ tầng", robotics:"Robotics và tự động hóa",
      cybersecurity:"An toàn công nghệ", chinh_sach_cuoc_dua_toan_cau:"Chính sách và cuộc đua toàn cầu",
      radar_khu_vuc:"Radar khu vực", watchlist_24_72h:"Theo dõi tiếp"
    };
    const order = Object.keys(labels);
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function storyHtml(s){
      const warning = s.confirmation_label === "chua_duoc_xac_nhan_rong";
      const links = Array.isArray(s.links) ? s.links : [];
      return `<article class="story">
        <div class="meta"><span class="badge${warning?' warn':''}">${warning?'Tín hiệu ban đầu':'Nóng'}</span><span>${esc(s.independent_domain_count||0)} báo độc lập</span><span>${esc(s.source_count||0)} nguồn</span><span>${esc(s.freshness_hours||0)} giờ</span></div>
        <h3>${esc(s.headline)}</h3><p>${esc(s.summary)}</p>
        ${s.why_it_matters ? `<p><strong>Vì sao đáng chú ý:</strong> ${esc(s.why_it_matters)}</p>` : ""}
        ${s.practical_use ? `<p class="use"><strong>Cách dùng:</strong> ${esc(s.practical_use)}</p>` : ""}
        ${links.length ? `<ul class="links">${links.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title||x.domain)}</a></li>`).join("")}</ul>` : ""}
      </article>`;
    }
    function render(data){
      const stats = data.stats || {};
      document.getElementById("stats").innerHTML = `<span class="pill">${esc(stats.story_count||0)} câu chuyện</span><span class="pill">Cửa sổ ${esc(data.window_hours||72)} giờ</span><span class="pill">Cập nhật ${esc((data.generated_at_utc||"").replace("T"," ").slice(0,16))} UTC</span>`;
      const sections = data.sections || {};
      document.getElementById("sections").innerHTML = order.filter(k=>Array.isArray(sections[k])&&sections[k].length).map(k=>`<section class="section"><h2>${esc(labels[k])}</h2><div class="stories">${sections[k].map(storyHtml).join("")}</div></section>`).join("");
    }
    fetch(`data/publication.json?ts=${Date.now()}`, {cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Chưa có bản tin Tech 72h hợp lệ");return r.json()}).then(render).catch(err=>{const box=document.getElementById("error");box.hidden=false;box.textContent=err.message||String(err)});
  </script>
</body>
</html>
